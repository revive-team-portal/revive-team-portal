<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revive — Guide</title><link rel="stylesheet" href="/chrome.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;font-family:system-ui,sans-serif;color:#1c1917;background:#fafaf9}
.wrap{display:flex;max-width:1200px;margin:0 auto}nav.side{width:210px;padding:16px;border-right:1px solid #e7e5e4;min-height:90vh}
nav.side a{display:block;padding:6px 8px;color:#16543f;text-decoration:none;border-radius:6px;font-size:14px}nav.side a.on{background:#16543f;color:#fff}
main{flex:1;padding:16px 28px;min-width:0}main table{border-collapse:collapse;font-size:14px;display:block;overflow-x:auto}main td,main th{border:1px solid #e7e5e4;padding:5px 8px;vertical-align:top}
main code{background:#f5f5f4;padding:1px 4px;border-radius:4px}main pre{background:#f5f5f4;padding:10px;overflow-x:auto}
@media(max-width:700px){.wrap{display:block}nav.side{width:auto;border:0;display:flex;flex-wrap:wrap;gap:4px;min-height:0}}</style></head>
<body><div class="rv-nav"><a class="rv-back" href="/">← Portal</a><span style="color:#fff;font-weight:600;margin-left:12px">Guide</span></div>
<div class="wrap"><nav class="side" id="side"></nav><main id="doc">Loading…</main></div>
<script>
const PORTAL_URL='https://zpcbtfdjcsbdeqnizrpr.supabase.co';
const PORTAL_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwY2J0ZmRqY3NiZGVxbml6cnByIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwODkzNDcsImV4cCI6MjA5MzY2NTM0N30.chmQ9vY8vc0Yyu81d-a6bccIgGsFIIRrdo6kEKFS79w';
const DOCS=[['README','Index'],['STACK','Tech stack & keys'],['REVIEW-2026-09','Review Sep 2026'],['recipes','Recipes'],['sales','Sales'],['support','Support'],['rostering','Rostering'],['production','Production'],['pulse','Pulse'],['scorecard','Scorecard'],['tasks','Tasks'],['timeclock','Timeclock'],['checklist','Checklist'],['training','Training'],['recon','Recon'],['ads','Ads'],['jobs','Jobs'],['me','My Page'],['music','Music'],['pos','POS setup'],['_TEMPLATE','New app template']];
const sb=supabase.createClient(PORTAL_URL,PORTAL_ANON);
async function show(id){document.querySelectorAll('#side a').forEach(a=>a.classList.toggle('on',a.dataset.id===id));
  const r=await fetch('/docs/'+id+'.md?'+Date.now());const md=r.ok?await r.text():'Not found';
  document.getElementById('doc').innerHTML=marked.parse(md.replace(/\]\(([A-Za-z0-9_-]+)\.md\)/g,'](#$1)'));scrollTo(0,0);}
(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){location.href='/';return;}
  const {data:p}=await sb.from('profiles').select('is_admin').eq('id',session.user.id).single();
  if(!p||!p.is_admin){document.getElementById('doc').textContent='Admins only.';return;}
  document.getElementById('side').innerHTML=DOCS.map(([id,t])=>'<a href="#'+id+'" data-id="'+id+'">'+t+'</a>').join('');
  const go=()=>show((location.hash||'#README').slice(1));addEventListener('hashchange',go);go();})();
</script></body></html>
