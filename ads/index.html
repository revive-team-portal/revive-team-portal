<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revive — Ads</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    [v-cloak]{display:none}
    ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#d6d3d1;border-radius:6px}
    .num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
    .clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .thumb{width:76px;height:135px;object-fit:cover;background:#e7e5e4}
    .chip{display:inline-flex;align-items:center;gap:.25rem;font-size:11px;line-height:1;padding:.25rem .45rem;border-radius:.4rem;white-space:nowrap}
    .score-bar{height:5px;border-radius:3px;background:#e7e5e4;overflow:hidden}
    .score-bar i{display:block;height:100%;background:#16543f}
  </style>
  <link rel="stylesheet" href="/chrome.css">
</head>
<body class="bg-stone-100 font-sans text-stone-900">
<script src="/today-bar.js" defer></script>
<script>
  const PORTAL_URL='https://zpcbtfdjcsbdeqnizrpr.supabase.co';
  const PORTAL_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwY2J0ZmRqY3NiZGVxbml6cnByIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwODkzNDcsImV4cCI6MjA5MzY2NTM0N30.chmQ9vY8vc0Yyu81d-a6bccIgGsFIIRrdo6kEKFS79w';
</script>

<div id="app" v-cloak>

  <div v-if="!ready" class="rv-load">
    <div class="rv-load__scrim"></div>
    <div class="rv-load__box">
      <img class="rv-load__logo" src="/assets/revive-logo.png" alt="Revive Cafe">
      <div class="rv-load__text">Loading ad creative</div>
      <div class="rv-load__bar"><i></i></div>
    </div>
  </div>

  <template v-else>
    <nav class="rv-nav">
      <div class="rv-left">
        <a href="/" class="rv-portal rv-back">&larr; Portal</a>
        <img class="rv-logo" src="/assets/revive-logo.png" alt="Revive Cafe">
        <span class="rv-appname">Ads</span>
      </div>
      <div class="rv-right">
        <button class="rv-btn" @click="run('sync')" :disabled="busy">{{ busy ? 'Working…' : 'Refresh from Meta' }}</button>
        <button class="rv-btn rv-btn-primary" @click="run('analyse')" :disabled="busy">Analyse next 5</button>
      </div>
    </nav>

    <div v-if="gateError" class="max-w-2xl mx-auto mt-16 bg-white rounded-xl border border-stone-200 p-6 text-center">
      <p class="text-stone-700">{{ gateError }}</p>
    </div>

    <main v-else class="max-w-[1500px] mx-auto p-4 md:p-6 space-y-4">

      <p v-if="msg" class="rounded-lg px-3 py-2 text-sm" :class="msgBad?'bg-red-50 text-red-800 border border-red-200':'bg-emerald-50 text-emerald-800 border border-emerald-200'">{{ msg }}</p>

      <!-- summary -->
      <section class="grid grid-cols-2 md:grid-cols-5 gap-3">
        <div class="bg-white rounded-xl border border-stone-200 p-3">
          <div class="text-[11px] uppercase tracking-wide text-stone-500">Ads</div>
          <div class="text-2xl font-semibold">{{ all.length }}</div>
        </div>
        <div class="bg-white rounded-xl border border-stone-200 p-3">
          <div class="text-[11px] uppercase tracking-wide text-stone-500">Analysed</div>
          <div class="text-2xl font-semibold">{{ counts.done || 0 }}</div>
        </div>
        <div class="bg-white rounded-xl border border-stone-200 p-3">
          <div class="text-[11px] uppercase tracking-wide text-stone-500">Awaiting analysis</div>
          <div class="text-2xl font-semibold">{{ counts.pending || 0 }}</div>
        </div>
        <div class="bg-white rounded-xl border border-stone-200 p-3">
          <div class="text-[11px] uppercase tracking-wide text-stone-500">Video unavailable</div>
          <div class="text-2xl font-semibold">{{ counts.unavailable || 0 }}</div>
        </div>
        <div class="bg-white rounded-xl border border-stone-200 p-3">
          <div class="text-[11px] uppercase tracking-wide text-stone-500">Spend (lifetime)</div>
          <div class="text-2xl font-semibold">{{ money(totalSpend) }}</div>
        </div>
      </section>

      <!-- filters -->
      <section class="bg-white rounded-xl border border-stone-200 p-3 flex flex-wrap items-center gap-2">
        <input v-model="q" type="search" placeholder="Search name, copy, headline, transcript…"
               class="border border-stone-300 rounded-lg px-3 py-1.5 text-sm w-64">
        <select v-model="brand" class="border border-stone-300 rounded-lg px-2 py-1.5 text-sm">
          <option value="">All brands</option>
          <option v-for="b in brands" :key="b" :value="b">{{ b }}</option>
        </select>
        <select v-model="media" class="border border-stone-300 rounded-lg px-2 py-1.5 text-sm">
          <option value="">All media</option>
          <option value="video">Video</option>
          <option value="image">Still image</option>
          <option value="carousel">Carousel</option>
          <option value="video_locked">Video (unavailable)</option>
        </select>
        <select v-model="campaign" class="border border-stone-300 rounded-lg px-2 py-1.5 text-sm max-w-[220px]">
          <option value="">All campaigns</option>
          <option v-for="c in campaigns" :key="c" :value="c">{{ c }}</option>
        </select>
        <label class="chip bg-stone-100 text-stone-700 cursor-pointer"><input type="checkbox" v-model="onlyActive7"> Active last 7 days</label>
        <label class="chip bg-stone-100 text-stone-700 cursor-pointer"><input type="checkbox" v-model="onlySpend"> Has spend</label>
        <label class="chip bg-stone-100 text-stone-700 cursor-pointer"><input type="checkbox" v-model="onlyAnalysed"> Analysed only</label>
        <select v-model="sort" class="border border-stone-300 rounded-lg px-2 py-1.5 text-sm ml-auto">
          <option value="latest">Newest first</option>
          <option value="spend">Highest spend</option>
          <option value="purch">Most purchases (7d click)</option>
          <option value="score">Best overall score</option>
        </select>
        <span class="text-xs text-stone-500">{{ rows.length }} shown</span>
      </section>

      <!-- list -->
      <section class="space-y-2">
        <article v-for="a in rows" :key="a.ad_id" class="bg-white rounded-xl border border-stone-200 p-3">
          <div class="flex gap-3">

            <!-- creative -->
            <div class="shrink-0">
              <img v-if="a.thumb" :src="a.thumb" class="thumb rounded-lg border border-stone-200" loading="lazy" alt="">
              <div v-else class="thumb rounded-lg border border-stone-200 flex items-center justify-center text-[10px] text-stone-400 text-center px-1">no image</div>
              <a v-if="a.permalink" :href="a.permalink" target="_blank" rel="noopener"
                 class="block text-center text-[11px] text-emerald-800 underline mt-1">See the ad</a>
              <div class="text-center text-[10px] text-stone-400 mt-0.5">{{ a.ad_id }}</div>
            </div>

            <!-- everything else -->
            <div class="min-w-0 flex-1">
              <div class="flex flex-wrap items-baseline gap-x-2 gap-y-1">
                <h3 class="font-semibold text-sm truncate max-w-[420px]">{{ a.ad_name }}</h3>
                <span class="chip" :class="mediaChip(a)">{{ mediaLabel(a) }}</span>
                <span v-if="a.active_last_7" class="chip bg-emerald-100 text-emerald-800">Active last 7 days</span>
                <span v-else class="chip bg-stone-100 text-stone-500">Not running</span>
                <span class="chip bg-stone-100 text-stone-600">{{ a.brand }}</span>
              </div>

              <div class="text-[11px] text-stone-500 mt-0.5 truncate">
                {{ a.campaign_name || '—' }} <span class="text-stone-300">›</span> {{ a.adset_name || '—' }}
                <span class="text-stone-300">·</span> {{ dateNz(a.created_time) }}
                <span v-if="a.first_seen"> → {{ a.last_seen }}</span>
                <span v-if="a.duration_sec" class="text-stone-300">·</span>
                <span v-if="a.duration_sec">{{ a.duration_sec }}s</span>
              </div>

              <!-- performance -->
              <div class="flex flex-wrap gap-x-4 gap-y-1 mt-2 text-xs">
                <span><span class="text-stone-500">Spend</span> <b class="num">{{ money(a.spend) }}</b></span>
                <span><span class="text-stone-500">Purchases</span>
                  <b class="num">{{ n(a.purchases_7d_click) }}</b><span class="text-stone-400 text-[10px]"> 7d click</span>
                  <span class="text-stone-400">·</span><b class="num">{{ n(a.purchases_1d_click) }}</b><span class="text-stone-400 text-[10px]"> 1d click</span>
                  <span class="text-stone-400">·</span><b class="num">{{ n(a.purchases_1d_view) }}</b><span class="text-stone-400 text-[10px]"> 1d view</span>
                </span>
                <span><span class="text-stone-500">Revenue</span> <b class="num">{{ money(a.value_7d_click) }}</b></span>
                <span><span class="text-stone-500">CTR</span> <b class="num">{{ pct(a.ctr/100) }}</b></span>
                <span v-if="a.hook_rate != null"><span class="text-stone-500">Hook</span> <b class="num">{{ pct(a.hook_rate) }}</b></span>
                <span v-if="a.hold_rate != null"><span class="text-stone-500">Hold</span> <b class="num">{{ pct(a.hold_rate) }}</b></span>
              </div>

              <!-- copy -->
              <div class="mt-2 grid md:grid-cols-2 gap-x-4 gap-y-1">
                <div>
                  <div class="text-[10px] uppercase tracking-wide text-stone-400">Headline</div>
                  <div class="text-xs">{{ a.headline || '—' }}
                    <span v-if="a.headline_shared > 1" class="chip bg-amber-100 text-amber-800 ml-1">shared with {{ a.headline_shared - 1 }} other{{ a.headline_shared > 2 ? 's' : '' }}</span>
                    <span v-if="a.headline_variants > 1" class="chip bg-stone-100 text-stone-600 ml-1">{{ a.headline_variants }} variants</span>
                  </div>
                </div>
                <div>
                  <div class="text-[10px] uppercase tracking-wide text-stone-400">Landing page</div>
                  <a v-if="a.landing_url" :href="a.landing_url" target="_blank" rel="noopener" class="text-xs text-emerald-800 underline break-all">{{ a.landing_page }}</a>
                  <span v-else class="text-xs text-stone-400">—</span>
                  <span v-if="a.utm" class="chip bg-stone-100 text-stone-600 ml-1">utm</span>
                </div>
              </div>

              <div class="mt-1">
                <div class="text-[10px] uppercase tracking-wide text-stone-400">Key text
                  <span v-if="a.body_shared > 1" class="chip bg-amber-100 text-amber-800 ml-1">same copy as {{ a.body_shared - 1 }} other{{ a.body_shared > 2 ? 's' : '' }}</span>
                  <span v-if="a.body_variants > 1" class="chip bg-stone-100 text-stone-600 ml-1">{{ a.body_variants }} variants</span>
                </div>
                <p class="text-xs text-stone-700 whitespace-pre-line" :class="open[a.ad_id+':body'] ? '' : 'clamp2'">{{ a.body || '—' }}</p>
                <button v-if="(a.body||'').length > 140" class="text-[11px] text-emerald-800 underline" @click="toggle(a.ad_id+':body')">
                  {{ open[a.ad_id+':body'] ? 'Show less' : 'Show all' }}
                </button>
              </div>

              <!-- analysis -->
              <div v-if="a.analysis_state === 'done' && a.tags" class="mt-2 border-t border-stone-100 pt-2">
                <div class="flex flex-wrap gap-x-4 gap-y-1 text-xs">
                  <span v-if="a.tags.format"><span class="text-stone-500">Format</span> <b>{{ pretty(a.tags.format) }}</b></span>
                  <span v-if="a.tags.lighting"><span class="text-stone-500">Lighting</span> <b>{{ pretty(a.tags.lighting) }}</b></span>
                  <span v-if="a.tags.shoot_type"><span class="text-stone-500">Shoot</span> <b>{{ pretty(a.tags.shoot_type) }}</b></span>
                  <span><span class="text-stone-500">Product first shown</span> <b>{{ a.tags.first_product_at == null ? 'not seen' : a.tags.first_product_at + 's' }}</b></span>
                  <span v-if="!a.tags.still_analysis"><span class="text-stone-500">First cut</span> <b>{{ a.tags.time_to_first_cut == null ? '—' : a.tags.time_to_first_cut + 's' }}</b></span>
                  <span v-if="!a.tags.still_analysis"><span class="text-stone-500">Cuts</span> <b>{{ a.tags.total_cuts }}</b></span>
                  <span v-if="a.tags.toaster_or_plate" class="chip bg-stone-100 text-stone-700">toaster / plate</span>
                  <span v-if="a.tags.eating_on_camera" class="chip bg-stone-100 text-stone-700">eating on camera</span>
                  <span v-if="a.tags.subtitles_present" class="chip bg-stone-100 text-stone-700">subtitles</span>
                  <span v-for="c in (a.tags.visible_claims||[])" :key="c" class="chip bg-sky-100 text-sky-800">{{ c }}</span>
                </div>

                <div v-if="a.tags.scores" class="grid grid-cols-2 md:grid-cols-6 gap-2 mt-2">
                  <div v-for="(v,k) in a.tags.scores" :key="k">
                    <div class="flex justify-between text-[10px] text-stone-500"><span>{{ pretty(k) }}</span><span class="num">{{ v }}</span></div>
                    <div class="score-bar"><i :style="{width: (Math.max(0,Math.min(10,Number(v)))*10)+'%'}"></i></div>
                  </div>
                </div>

                <p v-if="a.tags.recommendation" class="text-xs mt-2 bg-emerald-50 border border-emerald-100 rounded-lg px-2 py-1.5">
                  <span class="font-semibold">Recommendation.</span> {{ a.tags.recommendation }}
                  <span v-if="a.tags.verdict && a.tags.verdict.confidence" class="chip bg-white text-stone-600 border border-stone-200 ml-1">{{ a.tags.verdict.confidence }} confidence</span>
                </p>

                <div v-if="a.tags.hook_words" class="text-xs mt-1"><span class="text-stone-500">Hook words</span> “{{ a.tags.hook_words }}”</div>

                <div v-if="a.tags.transcript" class="mt-1">
                  <div class="text-[10px] uppercase tracking-wide text-stone-400">
                    Spoken words <span class="text-stone-400 normal-case">({{ a.tags.spoken_words }} words, {{ a.tags.transcript_source }})</span>
                  </div>
                  <p class="text-xs text-stone-700" :class="open[a.ad_id+':tr'] ? '' : 'clamp2'">{{ a.tags.transcript }}</p>
                  <button class="text-[11px] text-emerald-800 underline" @click="toggle(a.ad_id+':tr')">
                    {{ open[a.ad_id+':tr'] ? 'Show less' : 'Show all spoken words' }}
                  </button>
                </div>

                <div v-if="a.tags.onscreen_text" class="mt-1">
                  <div class="text-[10px] uppercase tracking-wide text-stone-400">On-screen text (burned in)</div>
                  <p class="text-xs text-stone-700" :class="open[a.ad_id+':os'] ? '' : 'clamp2'">{{ a.tags.onscreen_text }}</p>
                  <button v-if="(a.tags.onscreen_text||'').length > 140" class="text-[11px] text-emerald-800 underline" @click="toggle(a.ad_id+':os')">
                    {{ open[a.ad_id+':os'] ? 'Show less' : 'Show all' }}
                  </button>
                </div>
              </div>

              <div v-else class="mt-2 border-t border-stone-100 pt-2">
                <p v-if="a.analysis_state === 'pending'" class="text-xs text-stone-500 italic">
                  {{ a.media_type === 'video' ? 'Video analysis pending' : 'Image analysis pending' }} — copy, spend and results above are live.
                </p>
                <p v-else-if="a.analysis_state === 'unavailable'" class="text-xs text-amber-700">
                  Video analysis unavailable. {{ a.analysis_note }}
                </p>
                <p v-else-if="a.analysis_state === 'error'" class="text-xs text-red-700">
                  Analysis failed. {{ a.analysis_note }}
                </p>
                <p v-else class="text-xs text-stone-500 italic">No creative to analyse on this ad.</p>
              </div>

            </div>
          </div>
        </article>

        <p v-if="!rows.length" class="text-center text-stone-500 text-sm py-10">No ads match these filters.</p>
      </section>

      <p class="text-center text-[11px] text-stone-400 pb-6">
        Purchases are shown split by attribution window, never blended. Meta's account clock runs a day behind New Zealand.
        Data generated {{ generatedAt }}.
      </p>
    </main>
  </template>
</div>

<script>
const { createApp, ref, reactive, computed, onMounted } = Vue;
const { createClient } = supabase;
const portal = createClient(PORTAL_URL, PORTAL_ANON);

createApp({
  setup(){
    const ready=ref(false), gateError=ref(''), busy=ref(false), msg=ref(''), msgBad=ref(false);
    const all=ref([]), counts=ref({}), brands=ref([]), campaigns=ref([]), generatedAt=ref('');
    const q=ref(''), brand=ref(''), media=ref(''), campaign=ref('');
    const onlyActive7=ref(false), onlySpend=ref(false), onlyAnalysed=ref(false);
    const sort=ref('latest');
    const open=reactive({});

    const nzFmt=new Intl.DateTimeFormat('en-NZ',{timeZone:'Pacific/Auckland',day:'2-digit',month:'short',year:'numeric'});
    function dateNz(s){ if(!s) return '—'; try{ return nzFmt.format(new Date(s)); }catch(e){ return '—'; } }
    function money(v){ const n=Number(v)||0; return '$'+n.toLocaleString('en-NZ',{minimumFractionDigits:n<100?2:0,maximumFractionDigits:n<100?2:0}); }
    function n(v){ return (Number(v)||0).toLocaleString('en-NZ'); }
    function pct(v){ if(v==null||isNaN(v)) return '—'; return (Number(v)*100).toFixed(1)+'%'; }
    function pretty(s){ return String(s||'').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()); }
    function toggle(k){ open[k]=!open[k]; }

    function mediaLabel(a){
      if(a.media_type==='video') return 'Video';
      if(a.media_type==='video_locked') return 'Video (locked)';
      if(a.media_type==='carousel') return 'Carousel · '+a.carousel_cards;
      if(a.media_type==='image') return 'Still';
      return 'Other';
    }
    function mediaChip(a){
      if(a.media_type==='video') return 'bg-indigo-100 text-indigo-800';
      if(a.media_type==='video_locked') return 'bg-amber-100 text-amber-800';
      if(a.media_type==='carousel') return 'bg-purple-100 text-purple-800';
      if(a.media_type==='image') return 'bg-teal-100 text-teal-800';
      return 'bg-stone-100 text-stone-600';
    }

    const totalSpend=computed(()=> all.value.reduce((s,a)=>s+(Number(a.spend)||0),0));

    const rows=computed(()=>{
      const term=q.value.trim().toLowerCase();
      let r=all.value.filter(a=>{
        if(brand.value && a.brand!==brand.value) return false;
        if(media.value && a.media_type!==media.value) return false;
        if(campaign.value && a.campaign_name!==campaign.value) return false;
        if(onlyActive7.value && !a.active_last_7) return false;
        if(onlySpend.value && !(Number(a.spend)>0)) return false;
        if(onlyAnalysed.value && a.analysis_state!=='done') return false;
        if(term){
          const hay=[a.ad_name,a.body,a.headline,a.campaign_name,a.adset_name,a.landing_page,
                     a.tags&&a.tags.transcript,a.tags&&a.tags.onscreen_text,a.tags&&a.tags.hook_words]
                    .filter(Boolean).join(' ').toLowerCase();
          if(!hay.includes(term)) return false;
        }
        return true;
      });
      const s=sort.value;
      r=r.slice().sort((x,y)=>{
        if(s==='spend') return (Number(y.spend)||0)-(Number(x.spend)||0);
        if(s==='purch') return (Number(y.purchases_7d_click)||0)-(Number(x.purchases_7d_click)||0);
        if(s==='score'){
          const sc=a=>(a.tags&&a.tags.scores&&Number(a.tags.scores.overall))||-1;
          return sc(y)-sc(x);
        }
        return String(y.created_time||'').localeCompare(String(x.created_time||''));
      });
      return r;
    });

    async function token(){ const {data:{session}}=await portal.auth.getSession(); return session?session.access_token:''; }

    async function load(){
      const r=await fetch('/.netlify/functions/ads-data',{headers:{'Authorization':'Bearer '+await token()}});
      const j=await r.json().catch(()=>({error:'Bad response from server.'}));
      if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
      all.value=j.ads||[]; counts.value=j.counts||{};
      brands.value=j.brands||[]; campaigns.value=j.campaigns||[];
      generatedAt.value=dateNz(j.generated_at);
    }

    function flash(t,bad){ msg.value=t; msgBad.value=!!bad; setTimeout(()=>{ if(msg.value===t) msg.value=''; },9000); }

    async function run(action){
      busy.value=true;
      try{
        const r=await fetch('/.netlify/functions/ads-run',{
          method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+await token()},
          body:JSON.stringify({action,limit:5})});
        const j=await r.json().catch(()=>({error:'Bad response from server.'}));
        if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
        flash(j.message||'Started.');
      }catch(e){ flash(e.message||'Could not start that job.',true); }
      busy.value=false;
    }

    onMounted(async()=>{
      const {data:{session:p}}=await portal.auth.getSession();
      if(!p){ window.location.href='/'; return; }
      try{
        try{ await load(); }
        catch(e1){
          if(/not authenticated|401|jwt|expired|token/i.test(e1.message||'')){
            try{ if(portal.auth.refreshSession) await portal.auth.refreshSession(); }catch(_){}
            await load();
          } else throw e1;
        }
      }catch(e){
        const m=e.message||'';
        gateError.value=/access/i.test(m)
          ? "You don't have access to Ads. Ask an administrator to grant it."
          : ('Could not load Ads: '+m);
      }
      ready.value=true;
    });

    return { ready,gateError,busy,msg,msgBad,all,counts,brands,campaigns,generatedAt,
      q,brand,media,campaign,onlyActive7,onlySpend,onlyAnalysed,sort,open,
      rows,totalSpend,dateNz,money,n,pct,pretty,toggle,mediaLabel,mediaChip,run };
  }
}).mount('#app');
</script>
</body>
</html>
