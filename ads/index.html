<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revive — Ads</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    [v-cloak]{display:none}
    ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#d6d3d1;border-radius:6px}
    .num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
    .clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .thumb{width:72px;height:128px;object-fit:cover;background:#e7e5e4}
    .chip{display:inline-flex;align-items:center;gap:.25rem;font-size:11px;line-height:1;padding:.2rem .4rem;border-radius:.4rem;white-space:nowrap}
    /* Metric boxes — one visual unit per number so the row reads as a strip. */
    .stat{border:1px solid #e7e5e4;border-radius:.5rem;padding:.3rem .45rem;background:#fafaf9;min-width:64px}
    .stat b{display:block;font-size:13px;line-height:1.15;font-variant-numeric:tabular-nums}
    .stat span{display:block;font-size:9.5px;letter-spacing:.03em;text-transform:uppercase;color:#78716c;line-height:1.2}
    .stat.good{background:#ecfdf5;border-color:#a7f3d0}
    .stat.bad{background:#fef2f2;border-color:#fecaca}
    /* Score bars: thick enough to read at a glance, coloured by band. */
    .sbar{height:10px;border-radius:5px;background:#e7e5e4;overflow:hidden}
    .sbar i{display:block;height:100%;border-radius:5px}
    .s-hi i{background:#15803d}
    .s-mid i{background:#d97706}
    .s-lo i{background:#dc2626}
    .clamp1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
    .clamp4{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
    .clamp5{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
  </style>
  <link rel="stylesheet" href="/chrome.css">
</head>
<body class="bg-stone-100 font-sans text-stone-900">
<script src="/today-bar.js" defer></script>
<script>
  const PORTAL_URL='https://zpcbtfdjcsbdeqnizrpr.supabase.co';
  const PORTAL_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwY2J0ZmRqY3NiZGVxbml6cnByIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwODkzNDcsImV4cCI6MjA5MzY2NTM0N30.chmQ9vY8vc0Yyu81d-a6bccIgGsFIIRrdo6kEKFS79w';
</script>

<div id="app" v-cloak>

  <div v-if="!ready" class="rv-load">
    <div class="rv-load__scrim"></div>
    <div class="rv-load__box">
      <img class="rv-load__logo" src="/assets/revive-logo.png" alt="Revive Cafe">
      <div class="rv-load__text">Loading ad creative</div>
      <div class="rv-load__bar"><i></i></div>
    </div>
  </div>

  <template v-else>
    <nav class="rv-nav">
      <div class="rv-left">
        <a href="/" class="rv-portal rv-back">&larr; Portal</a>
        <img class="rv-logo" src="/assets/revive-logo.png" alt="Revive Cafe">
        <span class="rv-appname">Ads</span>
      </div>
      <div class="rv-right">
        <button class="rv-btn" @click="run('sync')" :disabled="busy">{{ busy ? 'Working…' : 'Refresh from Meta' }}</button>
        <button class="rv-btn rv-btn-primary" @click="run('analyse')" :disabled="busy">Analyse next 5</button>
      </div>
    </nav>

    <div v-if="gateError" class="max-w-2xl mx-auto mt-16 bg-white rounded-xl border border-stone-200 p-6 text-center">
      <p class="text-stone-700">{{ gateError }}</p>
    </div>

    <main v-else class="max-w-[1500px] mx-auto p-4 md:p-6 space-y-4">

      <p v-if="msg" class="rounded-lg px-3 py-2 text-sm" :class="msgBad?'bg-red-50 text-red-800 border border-red-200':'bg-emerald-50 text-emerald-800 border border-emerald-200'">{{ msg }}</p>

      <!-- summary -->
      <section class="grid grid-cols-2 md:grid-cols-5 gap-3">
        <div class="bg-white rounded-xl border border-stone-200 p-3">
          <div class="text-[11px] uppercase tracking-wide text-stone-500">Ads</div>
          <div class="text-2xl font-semibold">{{ all.length }}</div>
        </div>
        <div class="bg-white rounded-xl border border-stone-200 p-3">
          <div class="text-[11px] uppercase tracking-wide text-stone-500">Analysed</div>
          <div class="text-2xl font-semibold">{{ counts.done || 0 }}</div>
        </div>
        <div class="bg-white rounded-xl border border-stone-200 p-3">
          <div class="text-[11px] uppercase tracking-wide text-stone-500">Awaiting analysis</div>
          <div class="text-2xl font-semibold">{{ counts.pending || 0 }}</div>
        </div>
        <div class="bg-white rounded-xl border border-stone-200 p-3">
          <div class="text-[11px] uppercase tracking-wide text-stone-500">Video unavailable</div>
          <div class="text-2xl font-semibold">{{ counts.unavailable || 0 }}</div>
        </div>
        <div class="bg-white rounded-xl border border-stone-200 p-3">
          <div class="text-[11px] uppercase tracking-wide text-stone-500">Spend (lifetime)</div>
          <div class="text-2xl font-semibold">{{ money(totalSpend) }}</div>
        </div>
      </section>

      <!-- filters -->
      <section class="bg-white rounded-xl border border-stone-200 p-3 flex flex-wrap items-center gap-2">
        <input v-model="q" type="search" placeholder="Search name, copy, headline, transcript…"
               class="border border-stone-300 rounded-lg px-3 py-1.5 text-sm w-64">
        <select v-model="brand" class="border border-stone-300 rounded-lg px-2 py-1.5 text-sm">
          <option value="">All brands</option>
          <option v-for="b in brands" :key="b" :value="b">{{ b }}</option>
        </select>
        <select v-model="media" class="border border-stone-300 rounded-lg px-2 py-1.5 text-sm">
          <option value="">All media</option>
          <option value="video">Video</option>
          <option value="image">Still image</option>
          <option value="carousel">Carousel</option>
          <option value="video_locked">Video (unavailable)</option>
        </select>
        <select v-model="campaign" class="border border-stone-300 rounded-lg px-2 py-1.5 text-sm max-w-[220px]">
          <option value="">All campaigns</option>
          <option v-for="c in campaigns" :key="c" :value="c">{{ c }}</option>
        </select>
        <label class="chip bg-stone-100 text-stone-700 cursor-pointer"><input type="checkbox" v-model="onlyActive7"> Active last 7 days</label>
        <label class="chip bg-stone-100 text-stone-700 cursor-pointer"><input type="checkbox" v-model="onlySpend"> Has spend</label>
        <label class="chip bg-stone-100 text-stone-700 cursor-pointer"><input type="checkbox" v-model="onlyAnalysed"> Analysed only</label>
        <label class="chip bg-emerald-50 text-emerald-800 cursor-pointer"><input type="checkbox" v-model="grouped"> Combine copies</label>
        <select v-model="sort" class="border border-stone-300 rounded-lg px-2 py-1.5 text-sm ml-auto">
          <option value="latest">Newest first</option>
          <option value="spend">Highest spend</option>
          <option value="purch">Most purchases (7d click)</option>
          <option value="score">Best overall score</option>
        </select>
        <span class="text-xs text-stone-500">{{ groups.length }} {{ grouped ? 'creatives' : 'ads' }}<span v-if="grouped && rows.length !== groups.length"> · {{ rows.length }} ads</span></span>
      </section>

      <!-- list -->
      <section class="space-y-2">
        <article v-for="g in groups" :key="g.key" class="bg-white rounded-xl border border-stone-200 p-2.5">
          <div class="flex flex-col md:flex-row gap-3">

            <!-- creative -->
            <div class="shrink-0 w-[72px]">
              <img v-if="g.lead.thumb" :src="g.lead.thumb" class="thumb rounded-lg border border-stone-200" loading="lazy" alt="">
              <div v-else class="thumb rounded-lg border border-stone-200 flex items-center justify-center text-[9px] text-stone-400 text-center px-1">no image</div>
              <a v-if="g.lead.permalink" :href="g.lead.permalink" target="_blank" rel="noopener"
                 class="block text-center text-[10px] text-emerald-800 underline mt-1">See ad</a>
            </div>

            <!-- LEFT: identity, numbers, scores -->
            <div class="min-w-0 flex-1 md:w-1/2">
              <div class="flex flex-wrap items-center gap-1.5">
                <h3 class="font-semibold text-[13px] truncate max-w-[260px]">{{ g.title }}</h3>
                <span class="chip" :class="mediaChip(g.lead)">{{ mediaLabel(g.lead) }}</span>
                <span v-if="g.copies.length > 1" class="chip bg-violet-100 text-violet-800 cursor-pointer" @click="toggle(g.key+':copies')">
                  {{ g.copies.length }} copies · {{ g.adsets.length }} ad set{{ g.adsets.length>1?'s':'' }}
                </span>
                <span v-if="g.active" class="chip bg-emerald-100 text-emerald-800">Live</span>
                <span class="chip bg-stone-100 text-stone-600">{{ g.lead.brand }}</span>
              </div>

              <div class="text-[10.5px] text-stone-500 mt-0.5 truncate">
                {{ g.campaigns.length > 1 ? g.campaigns.length + ' campaigns' : (g.campaigns[0] || '—') }}
                <span class="text-stone-300">›</span>
                {{ g.adsets.length > 1 ? g.adsets.length + ' ad sets' : (g.adsets[0] || '—') }}
                <span class="text-stone-300">·</span> {{ dateNz(g.created) }}
                <span v-if="g.lead.duration_sec"><span class="text-stone-300">·</span> {{ Math.round(g.lead.duration_sec) }}s</span>
              </div>

              <div v-if="open[g.key+':copies']" class="mt-1.5 border border-stone-200 rounded-lg overflow-hidden">
                <div v-for="c in g.copies" :key="c.ad_id" class="flex items-center gap-2 px-2 py-1 text-[10.5px] border-b border-stone-100 last:border-0">
                  <span class="truncate flex-1">{{ c.adset_name || '—' }}</span>
                  <span class="text-stone-400 truncate max-w-[130px]">{{ c.campaign_name }}</span>
                  <span class="num w-16">{{ money(c.spend) }}</span>
                  <span class="num w-8">{{ n(c.purchases_7d_click) }}</span>
                  <span class="chip" :class="c.active_last_7 ? 'bg-emerald-100 text-emerald-800' : 'bg-stone-100 text-stone-500'">{{ c.active_last_7 ? 'live' : 'off' }}</span>
                </div>
              </div>

              <!-- numbers -->
              <div class="flex flex-wrap gap-1.5 mt-2">
                <div class="stat"><b>{{ money(g.spend) }}</b><span>Spend</span></div>
                <div class="stat"><b>{{ n(g.purch7) }}</b><span>Purch 7d clk</span></div>
                <div class="stat"><b>{{ n(g.purch1c) }}</b><span>1d clk</span></div>
                <div class="stat"><b>{{ n(g.purch1v) }}</b><span>1d view</span></div>
                <div class="stat" :class="g.roas>=2 ? 'good' : (g.roas!=null && g.roas<1 ? 'bad' : '')"><b>{{ g.roas==null ? '—' : g.roas.toFixed(2)+'×' }}</b><span>ROAS</span></div>
                <div class="stat"><b>{{ g.cpa==null ? '—' : money(g.cpa) }}</b><span>CPA</span></div>
                <div class="stat"><b>{{ pct(g.hook) }}</b><span>Hook</span></div>
                <div class="stat"><b>{{ pct(g.hold) }}</b><span>Hold</span></div>
                <div class="stat"><b>{{ pct(g.ctr/100) }}</b><span>CTR</span></div>
              </div>

              <!-- scores: what each one covers, and the fix when it falls short -->
              <div v-if="g.tags && g.tags.scores" class="mt-2 grid grid-cols-1 sm:grid-cols-2 gap-x-3 gap-y-1.5">
                <div v-for="k in SCORE_ORDER" :key="k" v-show="g.tags.scores[k] != null">
                  <div class="flex items-baseline justify-between gap-2">
                    <span class="text-[10.5px] font-semibold text-stone-700">{{ SCORE_LABEL[k] }}</span>
                    <b class="num text-[11px]" :class="textBand(g.tags.scores[k])">{{ g.tags.scores[k] }}/10</b>
                  </div>
                  <div class="sbar" :class="band(g.tags.scores[k])"><i :style="{width: (Math.max(0,Math.min(10,Number(g.tags.scores[k])))*10)+'%'}"></i></div>
                  <div class="text-[9.5px] text-stone-400 leading-tight mt-0.5">{{ SCORE_WHAT[k] }}</div>
                  <div v-if="noteFor(g,k)" class="text-[10px] text-amber-800 leading-snug mt-0.5">→ {{ noteFor(g,k) }}</div>
                </div>
              </div>
            </div>

            <!-- RIGHT: the words — copy, what we saw, what to do, what was said -->
            <div class="min-w-0 md:w-1/2 md:border-l md:border-stone-100 md:pl-3 mt-2 md:mt-0">

              <div class="text-[11.5px] leading-snug">
                <div class="text-[9.5px] uppercase tracking-wide text-stone-400">Headline
                  <span v-if="g.lead.headline_shared > 1" class="chip bg-amber-100 text-amber-800">on {{ g.lead.headline_shared }} ads</span>
                  <span v-if="g.lead.headline_variants > 1" class="chip bg-stone-100 text-stone-600">{{ g.lead.headline_variants }} variants</span>
                </div>
                <div class="font-medium clamp1">{{ g.lead.headline || '—' }}</div>

                <div class="text-[9.5px] uppercase tracking-wide text-stone-400 mt-1">Key text
                  <span v-if="g.lead.body_shared > 1" class="chip bg-amber-100 text-amber-800">on {{ g.lead.body_shared }} ads</span>
                </div>
                <div :class="open[g.key+':body'] ? '' : 'clamp2'" class="text-stone-700 whitespace-pre-line">{{ g.lead.body || '—' }}</div>
                <div class="flex items-center gap-2">
                  <button v-if="(g.lead.body||'').length > 110" class="text-[10.5px] text-emerald-800 underline" @click="toggle(g.key+':body')">
                    {{ open[g.key+':body'] ? 'less' : 'more' }}</button>
                  <a v-if="g.lead.landing_url" :href="g.lead.landing_url" target="_blank" rel="noopener" class="text-[10.5px] text-emerald-800 underline truncate max-w-[220px]">{{ g.lead.landing_page }}</a>
                </div>
              </div>

              <template v-if="g.tags">
                <div v-if="(g.tags.observations||[]).length" class="mt-2">
                  <div class="text-[9.5px] uppercase tracking-wide text-stone-400">What we saw</div>
                  <ul class="text-[11px] leading-snug text-stone-700 list-disc pl-4 space-y-0.5">
                    <li v-for="(o,i) in g.tags.observations" :key="i">{{ o }}</li>
                  </ul>
                </div>

                <div v-if="g.tags.recommendation" class="mt-2 bg-emerald-50 border border-emerald-100 rounded-lg px-2 py-1.5">
                  <div class="text-[9.5px] uppercase tracking-wide text-emerald-800">Recommendation
                    <span v-if="g.tags.verdict && g.tags.verdict.confidence" class="chip bg-white text-stone-600 border border-stone-200">{{ g.tags.verdict.confidence }}</span>
                  </div>
                  <p class="text-[11.5px] leading-snug text-stone-800" :class="open[g.key+':rec'] ? '' : 'clamp3'">{{ g.tags.recommendation }}</p>
                  <button class="text-[10.5px] text-emerald-800 underline" @click="toggle(g.key+':rec')">{{ open[g.key+':rec'] ? 'less' : 'more' }}</button>
                </div>

                <div v-if="g.tags.transcript" class="mt-1.5">
                  <div class="text-[9.5px] uppercase tracking-wide text-stone-400">
                    Spoken · {{ g.tags.spoken_words }} words
                    <span v-if="g.tags.first_product_at != null" class="chip bg-stone-100 text-stone-600">product @ {{ g.tags.first_product_at }}s</span>
                    <span v-if="g.tags.lighting" class="chip bg-stone-100 text-stone-600">{{ g.tags.lighting }}</span>
                  </div>
                  <p class="text-[11px] leading-snug text-stone-600" :class="open[g.key+':tr'] ? '' : 'clamp2'">{{ g.tags.transcript }}</p>
                  <button class="text-[10.5px] text-emerald-800 underline" @click="toggle(g.key+':tr')">{{ open[g.key+':tr'] ? 'less' : 'all words' }}</button>
                </div>

                <div v-if="g.tags.onscreen_text" class="mt-1.5">
                  <div class="text-[9.5px] uppercase tracking-wide text-stone-400">On screen</div>
                  <p class="text-[11px] leading-snug text-stone-500" :class="open[g.key+':os'] ? '' : 'clamp2'">{{ g.tags.onscreen_text }}</p>
                  <button v-if="(g.tags.onscreen_text||'').length>110" class="text-[10.5px] text-emerald-800 underline" @click="toggle(g.key+':os')">{{ open[g.key+':os'] ? 'less' : 'more' }}</button>
                </div>
              </template>

              <template v-else>
                <p v-if="g.state === 'pending'" class="text-[11.5px] text-stone-400 italic mt-2">
                  {{ g.lead.media_type === 'video' ? 'Video' : 'Image' }} analysis pending — numbers and copy are live.
                </p>
                <p v-else-if="g.state === 'unavailable'" class="text-[11px] text-amber-700 clamp3 mt-2">Video unavailable. {{ g.lead.analysis_note }}</p>
                <p v-else-if="g.state === 'error'" class="text-[11px] text-red-700 clamp2 mt-2">Analysis failed. {{ g.lead.analysis_note }}</p>
                <p v-else class="text-[11.5px] text-stone-400 italic mt-2">No creative to analyse.</p>
              </template>
            </div>

          </div>
        </article>

        <p v-if="!groups.length" class="text-center text-stone-500 text-sm py-10">No ads match these filters.</p>
      </section>

      <p class="text-center text-[11px] text-stone-400 pb-6">
        Hook = 3-second plays ÷ impressions (not autoplay starts). Hold = ThruPlays ÷ 3-second plays.
        Purchases are split by attribution window, never blended. Meta's account clock runs a day behind New Zealand.
        Data generated {{ generatedAt }}.
      </p>
    </main>
  </template>
</div>

<script>
const { createApp, ref, reactive, computed, onMounted } = Vue;
const { createClient } = supabase;
const portal = createClient(PORTAL_URL, PORTAL_ANON);

createApp({
  setup(){
    const ready=ref(false), gateError=ref(''), busy=ref(false), msg=ref(''), msgBad=ref(false);
    const all=ref([]), counts=ref({}), brands=ref([]), campaigns=ref([]), generatedAt=ref('');
    const q=ref(''), brand=ref(''), media=ref(''), campaign=ref('');
    const onlyActive7=ref(false), onlySpend=ref(false), onlyAnalysed=ref(false);
    const grouped=ref(true);
    const sort=ref('latest');
    const open=reactive({});

    const nzFmt=new Intl.DateTimeFormat('en-NZ',{timeZone:'Pacific/Auckland',day:'2-digit',month:'short',year:'numeric'});
    function dateNz(s){ if(!s) return '—'; try{ return nzFmt.format(new Date(s)); }catch(e){ return '—'; } }
    function money(v){ const n=Number(v)||0; return '$'+n.toLocaleString('en-NZ',{minimumFractionDigits:n<100?2:0,maximumFractionDigits:n<100?2:0}); }
    function n(v){ return (Number(v)||0).toLocaleString('en-NZ'); }
    function pct(v){ if(v==null||isNaN(v)) return '—'; return (Number(v)*100).toFixed(1)+'%'; }
    function pretty(s){ return String(s||'').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()); }
    // The six dimensions, in a fixed order, each with what it actually covers.
    const SCORE_ORDER=['hook','clarity','product_visibility','credibility','craft','overall'];
    const SCORE_LABEL={hook:'Hook',clarity:'Clarity',product_visibility:'Product',credibility:'Trust',craft:'Craft',overall:'Overall'};
    const SCORE_WHAT={
      hook:'First 3 seconds — does it stop the scroll?',
      clarity:'Is it obvious what is sold, and what to do?',
      product_visibility:'How clearly and how early the product appears.',
      credibility:'Does it feel true — proof, real people, supported claims.',
      craft:'Framing, lighting, audio, pacing, subtitles.',
      overall:'Would you put more money behind it as it stands?',
    };
    const SHORT=SCORE_LABEL;
    function shortScore(k){ return SCORE_LABEL[k] || pretty(k); }
    function band(v){ const n=Number(v); return n>=8 ? 's-hi' : (n>=6 ? 's-mid' : 's-lo'); }
    function textBand(v){ const n=Number(v); return n>=8 ? 'text-green-700' : (n>=6 ? 'text-amber-600' : 'text-red-600'); }
    // Only show a fix where the score actually falls short.
    function noteFor(g,k){
      if(!g.tags || Number(g.tags.scores[k]) >= 8) return null;
      const nt=g.tags.score_notes;
      return (nt && nt[k]) ? nt[k] : null;
    }
    function toggle(k){ open[k]=!open[k]; }

    function mediaLabel(a){
      if(a.media_type==='video') return 'Video';
      if(a.media_type==='video_locked') return 'Video (locked)';
      if(a.media_type==='carousel') return 'Carousel · '+a.carousel_cards;
      if(a.media_type==='image') return 'Still';
      return 'Other';
    }
    function mediaChip(a){
      if(a.media_type==='video') return 'bg-indigo-100 text-indigo-800';
      if(a.media_type==='video_locked') return 'bg-amber-100 text-amber-800';
      if(a.media_type==='carousel') return 'bg-purple-100 text-purple-800';
      if(a.media_type==='image') return 'bg-teal-100 text-teal-800';
      return 'bg-stone-100 text-stone-600';
    }

    const totalSpend=computed(()=> all.value.reduce((s,a)=>s+(Number(a.spend)||0),0));

    const rows=computed(()=>{
      const term=q.value.trim().toLowerCase();
      let r=all.value.filter(a=>{
        if(brand.value && a.brand!==brand.value) return false;
        if(media.value && a.media_type!==media.value) return false;
        if(campaign.value && a.campaign_name!==campaign.value) return false;
        if(onlyActive7.value && !a.active_last_7) return false;
        if(onlySpend.value && !(Number(a.spend)>0)) return false;
        if(onlyAnalysed.value && a.analysis_state!=='done') return false;
        if(term){
          const hay=[a.ad_name,a.body,a.headline,a.campaign_name,a.adset_name,a.landing_page,
                     a.tags&&a.tags.transcript,a.tags&&a.tags.onscreen_text,a.tags&&a.tags.hook_words]
                    .filter(Boolean).join(' ').toLowerCase();
          if(!hay.includes(term)) return false;
        }
        return true;
      });
      return r;
    });

    // Combine copies of the same creative. The team's number ("164c") is the
    // reliable key; where an ad has none, the readable video id groups reruns
    // of the same film, and otherwise an ad stands alone.
    const groups=computed(()=>{
      const list=rows.value;
      if(!grouped.value) return list.map(a=>mkGroup(a.ad_id,[a]));
      const m=new Map();
      for(const a of list){
        const key=a.creative_code || a.readable_video_id || a.ad_id;
        if(!m.has(key)) m.set(key,[]);
        m.get(key).push(a);
      }
      const out=[...m.entries()].map(([k,v])=>mkGroup(k,v));
      const s=sort.value;
      return out.sort((x,y)=>{
        if(s==='spend') return y.spend-x.spend;
        if(s==='purch') return y.purch7-x.purch7;
        if(s==='score') return (scoreOf(y)-scoreOf(x));
        return String(y.created||'').localeCompare(String(x.created||''));
      });
    });
    function scoreOf(g){ return (g.tags&&g.tags.scores&&Number(g.tags.scores.overall)) || -1; }

    function mkGroup(key,copies){
      // Lead is the analysed copy if there is one, else the biggest spender —
      // that is the one whose creative and copy best represents the group.
      const lead=copies.slice().sort((a,b)=>{
        const t=(x)=>x.tags?1:0;
        return (t(b)-t(a)) || ((Number(b.spend)||0)-(Number(a.spend)||0));
      })[0];
      const sum=(f)=>copies.reduce((s,a)=>s+(Number(a[f])||0),0);
      const spend=sum('spend'), imp=sum('impressions');
      const purch7=sum('purchases_7d_click'), value7=sum('value_7d_click');
      const v3=sum('video_3s'), thru=sum('thruplays');
      const withTags=copies.find(a=>a.tags);
      const adsets=[...new Set(copies.map(a=>a.adset_name).filter(Boolean))];
      const campaigns=[...new Set(copies.map(a=>a.campaign_name).filter(Boolean))];
      // A weighted CTR, not an average of averages.
      const clicks=copies.reduce((s,a)=>s+((Number(a.ctr)||0)/100)*(Number(a.impressions)||0),0);
      return {
        key, copies, lead, adsets, campaigns,
        title: lead.ad_name,
        created: copies.map(a=>a.created_time).filter(Boolean).sort()[0],
        active: copies.some(a=>a.active_last_7),
        spend, impressions: imp,
        purch7, purch1c: sum('purchases_1d_click'), purch1v: sum('purchases_1d_view'),
        value7,
        roas: spend ? value7/spend : null,
        cpa: purch7 ? spend/purch7 : null,
        ctr: imp ? (clicks/imp)*100 : 0,
        hook: imp && v3 ? v3/imp : (lead.hook_rate!=null?lead.hook_rate:null),
        hold: v3 && thru ? thru/v3 : (lead.hold_rate!=null?lead.hold_rate:null),
        tags: withTags ? withTags.tags : null,
        state: copies.some(a=>a.analysis_state==='done') ? 'done'
             : (copies.some(a=>a.analysis_state==='pending') ? 'pending' : lead.analysis_state),
      };
    }

    async function token(){ const {data:{session}}=await portal.auth.getSession(); return session?session.access_token:''; }

    async function load(){
      const r=await fetch('/.netlify/functions/ads-data',{headers:{'Authorization':'Bearer '+await token()}});
      const j=await r.json().catch(()=>({error:'Bad response from server.'}));
      if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
      all.value=j.ads||[]; counts.value=j.counts||{};
      brands.value=j.brands||[]; campaigns.value=j.campaigns||[];
      generatedAt.value=dateNz(j.generated_at);
    }

    function flash(t,bad){ msg.value=t; msgBad.value=!!bad; setTimeout(()=>{ if(msg.value===t) msg.value=''; },9000); }

    async function run(action){
      busy.value=true;
      try{
        const r=await fetch('/.netlify/functions/ads-run',{
          method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+await token()},
          body:JSON.stringify({action,limit:5})});
        const j=await r.json().catch(()=>({error:'Bad response from server.'}));
        if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
        flash(j.message||'Started.');
      }catch(e){ flash(e.message||'Could not start that job.',true); }
      busy.value=false;
    }

    onMounted(async()=>{
      const {data:{session:p}}=await portal.auth.getSession();
      if(!p){ window.location.href='/'; return; }
      try{
        try{ await load(); }
        catch(e1){
          if(/not authenticated|401|jwt|expired|token/i.test(e1.message||'')){
            try{ if(portal.auth.refreshSession) await portal.auth.refreshSession(); }catch(_){}
            await load();
          } else throw e1;
        }
      }catch(e){
        const m=e.message||'';
        gateError.value=/access/i.test(m)
          ? "You don't have access to Ads. Ask an administrator to grant it."
          : ('Could not load Ads: '+m);
      }
      ready.value=true;
    });

    return { ready,gateError,busy,msg,msgBad,all,counts,brands,campaigns,generatedAt,
      q,brand,media,campaign,onlyActive7,onlySpend,onlyAnalysed,grouped,sort,open,
      rows,groups,totalSpend,dateNz,money,n,pct,pretty,shortScore,band,textBand,noteFor,
      SCORE_ORDER,SCORE_LABEL,SCORE_WHAT,toggle,mediaLabel,mediaChip,run };
  }
}).mount('#app');
</script>
