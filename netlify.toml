[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Server-side inbox sync + reconcile every 5 minutes
[functions."scheduled-sync"]
  schedule = "*/5 * * * *"

[functions."timekeeper-sync"]
  schedule = "20 18 * * *"

[functions."shopify-sync"]
  schedule = "40 18 * * *"

[functions."eship-sync-background"]
  schedule = "50 18 * * *"

# Daily wholesale sales sync from Xero into the Sales CRM (cron trigger fires the background worker)
[functions."sales-xero-cron"]
  schedule = "45 18 * * *"

[functions."pos-weekly"]
  schedule = "30 18 * * *"

[functions."pos-today-cron"]
  schedule = "*/15 * * * *"

[functions."meta-sync"]
  schedule = "40 18 * * *"

[functions."monthly-pos-report"]
  schedule = "0 18 28-31 * *"

[functions."timeclock-cleanup"]
  schedule = "0 2 * * *"

# Spam-folder rescue every hour
[functions."scheduled-spam-check"]
  schedule = "0 * * * *"

[functions."scheduled-nzpost-alert"]
  schedule = "5 * * * *"

[functions."scheduled-nzpost-delays"]
  schedule = "10 * * * *"

# --- Ads app -----------------------------------------------------------------
# The video worker ships ffmpeg + whisper.cpp as committed binaries. The repo has
# no package.json on purpose (adding one would change bundling for ~130 existing
# functions), and child_process is a Node builtin, so a binary is a plain file
# rather than a dependency. included_files scopes the 86 MB to this one function.
[functions."ads-video-background"]
  included_files = ["bin/**"]

# The recovery job needs ffmpeg (image fingerprints), but not whisper.
[functions."ads-recover-background"]
  included_files = ["bin/ffmpeg"]

# Nightly: refresh ad metadata, copy and performance for every ad (no video work).
# The schedule sits on a thin trigger because Netlify returns 403 to direct HTTP
# calls on a scheduled function, and the page needs to be able to run this on demand.
[functions."ads-sync-cron"]
  schedule = "15 17 * * *"

# Nightly, after the sync: tag any newly-seen videos. Self-limiting batch.
[functions."ads-video-cron"]
  schedule = "35 17 * * *"
