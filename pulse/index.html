<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pulse — Revive Surveys</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root{
    --green:#1f6f54; --green-d:#16543f; --green-l:#2f8a6a;
    --cream:#faf7f0; --ink:#243029; --muted:#6b7b72;
    --line:#e6e0d4; --card:#fff; --danger:#c0392b; --amber:#b7791f;
    --shadow:0 1px 3px rgba(20,40,30,.08),0 6px 18px rgba(20,40,30,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--cream);color:var(--ink);min-height:100vh}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}
  a{color:var(--green)}
  .hidden{display:none!important}
  /* top bar */
  header{background:var(--green);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
  header .mark{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:20px}
  header h1{font-size:17px;margin:0;font-weight:700;flex:1}
  header .who{font-size:13px;opacity:.9}
  header a.back{color:#fff;opacity:.85;text-decoration:none;font-size:13px;margin-right:6px}
  .wrap{display:flex;min-height:calc(100vh - 58px)}
  /* sidebar */
  aside{width:290px;border-right:1px solid var(--line);background:#fff;padding:16px;overflow-y:auto}
  aside .newbtn{width:100%;padding:11px;border:none;border-radius:10px;background:var(--green);color:#fff;font-weight:600;margin-bottom:14px}
  .slist{display:flex;flex-direction:column;gap:8px}
  .sitem{border:1px solid var(--line);border-radius:11px;padding:11px 12px;cursor:pointer;background:#fff}
  .sitem:hover{border-color:var(--green-l)}
  .sitem.active{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
  /* mobile: menu moves to the top */
  @media(max-width:760px){
    .wrap{flex-direction:column;min-height:0}
    aside{width:auto;border-right:none;border-bottom:1px solid var(--line);max-height:42vh;padding:12px 14px}
    main{padding:16px 14px}
    header h1{font-size:15px}
    .two{grid-template-columns:1fr}
    table{font-size:12px}
    .rowstat .lbl{width:130px}
  }
  .sitem h4{margin:0 0 3px;font-size:14.5px}
  .sitem .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
  .badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;font-weight:600}
  .b-open{background:#e4f2ea;color:var(--green-d)}
  .b-draft{background:#f3efe4;color:var(--amber)}
  .b-closed{background:#f0e7e5;color:var(--danger)}
  .b-comp{background:#efe9f6;color:#6b46a3}
  /* main */
  main{flex:1;padding:22px 26px;overflow-y:auto}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px}
  .tab{padding:9px 15px;border:none;background:none;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
  .tab.on{color:var(--green);border-bottom-color:var(--green)}
  h2{margin:0 0 4px;font-size:21px}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
  .qh{font-weight:650;margin:0 0 12px;font-size:15px}
  .qh .n{color:var(--muted);font-weight:600;font-size:12.5px;margin-left:6px}
  .rowstat{display:flex;align-items:center;gap:10px;margin:5px 0;font-size:13.5px}
  .rowstat .bar{flex:1;height:16px;background:#f0ede4;border-radius:5px;overflow:hidden}
  .rowstat .bar span{display:block;height:100%;background:var(--green-l)}
  .rowstat .lbl{width:190px}
  .rowstat .val{width:78px;text-align:right;color:var(--muted)}
  .txtlist{max-height:230px;overflow-y:auto;display:flex;flex-direction:column;gap:7px}
  .txtlist div{background:#f7f4ec;border-radius:8px;padding:8px 10px;font-size:13.5px}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .k{font-size:12px;color:var(--muted)}
  .stat .v{font-size:24px;font-weight:700}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;position:sticky;top:0;background:#fff}
  .btn{padding:9px 14px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:600;font-size:13.5px}
  .btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
  .btn.danger{color:var(--danger);border-color:#e6cfca}
  .btn.small{padding:5px 10px;font-size:12.5px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px}
  .field textarea{min-height:70px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}
  .qedit{border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:10px;background:#fff}
  .qedit .qtop{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .qedit .qtop select{width:150px}
  .qedit .qtop input{flex:1}
  .opts{padding-left:6px;display:flex;flex-direction:column;gap:5px;margin-top:6px}
  .opts .orow{display:flex;gap:6px}
  .muted{color:var(--muted)}
  .center{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--muted)}
  .link-box{display:flex;gap:8px;align-items:center;background:#f7f4ec;border-radius:9px;padding:9px 11px;font-size:13.5px}
  .link-box code{flex:1;word-break:break-all}
</style>
<link rel="stylesheet" href="/chrome.css">
</head>
<body>
<div id="gate" class="rv-load">
  <div class="rv-load__scrim"></div>
  <div class="rv-load__box">
    <img class="rv-load__logo" src="/assets/revive-logo.png" alt="Revive Cafe">
    <p class="rv-load__text">Opening Pulse</p>
    <div class="rv-load__bar"><i></i></div>
  </div>
</div>

<div id="appui" class="hidden">
<header class="rv-nav">
  <div class="rv-left"><a href="/" class="rv-portal rv-back">&larr; Portal</a><img class="rv-logo" src="/assets/revive-logo.png" alt="Revive Cafe"><span class="rv-appname">Pulse</span></div>
  <div class="rv-right"><span class="rv-who" id="who"></span></div>
</header>
<div class="wrap">
  <aside>
    <button class="newbtn" onclick="newSurvey()">+ New survey</button>
    <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin:0 0 8px 2px;cursor:pointer"><input type="checkbox" id="showClosed" onchange="toggleClosed()"> Show closed</label>
    <a onclick="renderStaff()" style="display:block;font-size:12.5px;color:var(--green);cursor:pointer;margin:0 0 12px 2px">⚙ Staff &amp; settings</a>
    <div class="slist" id="slist"></div>
  </aside>
  <main id="main"><div class="center">Select a survey to view results.</div></main>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL='https://xcwrawjdfajlmbkdwlbm.supabase.co';
const SUPABASE_ANON='sb_publishable_UQWjPFJDl7uUZkIMUWJQXA_LvLSKAVl';
const PORTAL_URL='https://zpcbtfdjcsbdeqnizrpr.supabase.co';
const PORTAL_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwY2J0ZmRqY3NiZGVxbml6cnByIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwODkzNDcsImV4cCI6MjA5MzY2NTM0N30.chmQ9vY8vc0Yyu81d-a6bccIgGsFIIRrdo6kEKFS79w';
const PUBLIC_BASE='https://pulse.revive.co.nz';       // customer form base (falls back below)
const FALLBACK_BASE='https://team.revive.co.nz/pulse-form';
const { createClient } = supabase;
const portal = createClient(PORTAL_URL, PORTAL_ANON);
const sb = createClient(SUPABASE_URL, SUPABASE_ANON, { db:{ schema:'pulse' } });

const $=id=>document.getElementById(id);
const esc=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT; function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}
const QTYPES=['info','image','short_text','long_text','radio','checkbox','dropdown','rating','yes_no','number','date','email','email_klaviyo','staff'];
const CHOICE=new Set(['radio','checkbox','dropdown','staff']);
const STAFF_DEFAULT=['Jasmin','Elyse','Mani','Fernando','River','Other'];
const TEXTQ=new Set(['short_text','long_text','email','email_klaviyo']);

let surveys=[], current=null, charts=[];

// ---------- auth gate ----------
(async function init(){
  const { data:{ session:p } } = await portal.auth.getSession();
  if(!p){ location.href='/'; return; }
  try{
    const r=await fetch('/.netlify/functions/pulse-session',{method:'POST',headers:{Authorization:'Bearer '+p.access_token}});
    if(!r.ok) throw new Error('gate');
    const s=await r.json();
    await sb.auth.setSession({access_token:s.access_token,refresh_token:s.refresh_token});
  }catch(e){ $('gate').innerHTML='Could not open Pulse. Please reload.'; return; }
  $('who').textContent=p.user.email||'';
  $('gate').classList.add('hidden'); $('appui').classList.remove('hidden');
  try{ await loadSurveys(); }catch(e){ $('appui').classList.add('hidden'); $('gate').classList.remove('hidden'); $('gate').innerHTML='<div class="rv-load__scrim"></div><div class="rv-load__box"><img class="rv-load__logo" src="/assets/revive-logo.png"><p class="rv-load__text">Couldn\'t load surveys. Please reload.</p></div>'; }
})();

async function loadSurveys(){
  const { data, error } = await sb.from('surveys').select('*').order('created_at',{ascending:false});
  if(error) throw error;
  surveys=data||[];
  // response counts + last response date
  const counts={};
  for(const s of surveys){
    const { count } = await sb.from('responses').select('*',{count:'exact',head:true}).eq('survey_id',s.id);
    counts[s.id]=count||0;
    const { data:last } = await sb.from('responses').select('submitted_at').eq('survey_id',s.id).order('submitted_at',{ascending:false}).limit(1);
    listLast[s.id]=last&&last[0]?last[0].submitted_at:null;
  }
  renderList(counts);
  if(current){ const c=surveys.find(x=>x.id===current.id); if(c){ current=c; } }
}

function statusBadge(s){ return `<span class="badge b-${s.status}">${s.status}</span>`; }
let showClosed=false, listCounts={}, listLast={};
function toggleClosed(){ showClosed=$('showClosed').checked; renderList(listCounts); }
function lastStr(id){ const d=listLast[id]; return d?new Date(d).toLocaleDateString('en-NZ',{day:'numeric',month:'short',year:'2-digit'}):'—'; }
function renderList(counts){
  listCounts=counts||listCounts;
  const list=surveys.filter(s=> showClosed || s.status!=='closed');
  $('slist').innerHTML=list.map(s=>{
    const drawLive = s.draw_enabled && s.draw_mode && s.draw_mode!=='none' && s.status==='open';
    return `
    <div class="sitem ${current&&current.id===s.id?'active':''}" onclick="openSurvey('${s.id}')">
      <h4>${esc(s.title)}</h4>
      <div class="meta">${statusBadge(s)} ${s.type==='competition'?'<span class="badge b-comp">competition</span>':''}</div>
      <div class="meta" style="margin-top:3px"><span>${listCounts[s.id]??0} responses</span><span>·</span><span>last ${lastStr(s.id)}</span></div>
      ${drawLive?'<div style="color:var(--green);font-size:12px;font-weight:600;margin-top:4px">🎁 Prize draw live</div>':''}
    </div>`;}).join('') || '<div class="muted">No surveys to show.</div>';
}

let activeTab='results';
async function openSurvey(id){
  current=surveys.find(s=>s.id===id); activeTab='results';
  document.querySelectorAll('.sitem').forEach(e=>e.classList.remove('active'));
  await render();
  renderList(await getCounts());
}
async function getCounts(){ const c={}; for(const s of surveys){ const {count}=await sb.from('responses').select('*',{count:'exact',head:true}).eq('survey_id',s.id); c[s.id]=count||0;} return c; }

function tabs(){
  const t=[['results','Results'],['responses','Responses'],['collectors','Collector links'],['setup','Setup & questions']];
  if(current.type==='competition') t.push(['draw','Prize draw']);
  return `<div class="tabs">${t.map(([k,l])=>`<button class="tab ${activeTab===k?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('')}</div>`;
}
function setTab(k){ activeTab=k; render(); }

async function render(){
  charts.forEach(c=>c.destroy()); charts=[];
  const s=current;
  let html=`<h2>${esc(s.title)}</h2><p class="sub">${statusBadge(s)} &nbsp; ${esc(s.type)} &nbsp;•&nbsp; slug: <code>${esc(s.slug)}</code></p>`+tabs()+'<div id="tabbody"></div>';
  $('main').innerHTML=html;
  if(activeTab==='results') await renderResults();
  else if(activeTab==='responses') await renderResponses();
  else if(activeTab==='collectors') await renderCollectors();
  else if(activeTab==='setup') await renderSetup();
  else if(activeTab==='draw') await renderDraw();
}

// ---------- RESULTS ----------
async function loadFull(){
  const { data:questions }=await sb.from('questions').select('*').eq('survey_id',current.id).order('sort_order');
  const qids=(questions||[]).map(q=>q.id);
  const { data:options }=qids.length?await sb.from('question_options').select('*').in('question_id',qids).order('sort_order'):{data:[]};
  const { data:responses }=await sb.from('responses').select('*').eq('survey_id',current.id).order('submitted_at',{ascending:false});
  const rids=(responses||[]).map(r=>r.id);
  let answers=[];
  if(rids.length){ // chunk to be safe
    for(let i=0;i<rids.length;i+=200){ const {data}=await sb.from('answers').select('*').in('response_id',rids.slice(i,i+200)); answers=answers.concat(data||[]); }
  }
  return { questions:questions||[], options:options||[], responses:responses||[], answers };
}

async function renderResults(){
  const {questions,options,responses,answers}=await loadFull();
  const body=$('tabbody');
  window._aitxt={};
  const total=responses.length;
  let html=`<div class="stat-grid">
    <div class="stat"><div class="k">Responses</div><div class="v">${total}</div></div>
    <div class="stat"><div class="k">Questions</div><div class="v">${questions.filter(q=>q.type!=='info').length}</div></div>
    <div class="stat"><div class="k">Last response</div><div class="v" style="font-size:15px">${total?new Date(responses[0].submitted_at).toLocaleDateString('en-NZ',{day:'numeric',month:'short',year:'numeric'}):'—'}</div></div>
  </div>`;
  html+=`<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 6px">
    <button class="btn primary" id="survaibtn" onclick="surveySummary()">✨ AI strategic summary</button>
    <button class="btn" id="pdfbtn" onclick="exportPdf()">⬇ Export PDF</button>
    <label class="muted" style="font-size:12.5px;display:flex;align-items:center;gap:5px"><input type="checkbox" id="pdf_ai" checked> AI summary at top</label>
    <label class="muted" style="font-size:12.5px;display:flex;align-items:center;gap:5px"><input type="checkbox" id="pdf_resp"> Include all open-ended responses</label>
  </div><div id="survai" style="margin-bottom:14px"></div>`;
  const byQ={}; answers.forEach(a=>{(byQ[a.question_id]=byQ[a.question_id]||[]).push(a);});
  const textQs=[]; window._themes=window._themes||{};
  questions.forEach((q,qi)=>{
    if(q.type==='info'||q.type==='image') return;
    const as=byQ[q.id]||[];
    html+=`<div class="card"><div class="qh">Q${qi}. ${esc(q.label)}<span class="n">${as.length} answered</span></div>`;
    if(CHOICE.has(q.type)||q.type==='yes_no'){
      const opts=q.type==='yes_no'?[{label:'Yes'},{label:'No'}]:options.filter(o=>o.question_id===q.id);
      const tally={}; opts.forEach(o=>tally[o.label]=0);
      as.forEach(a=>{ (a.value_options||(a.value?[a.value]:[])).forEach(v=>{ tally[v]=(tally[v]||0)+1; }); });
      const max=Math.max(1,...Object.values(tally));
      html+=Object.entries(tally).map(([l,c])=>`<div class="rowstat"><div class="lbl">${esc(l)}</div><div class="bar"><span style="width:${c/max*100}%"></span></div><div class="val">${c} (${as.length?Math.round(c/as.length*100):0}%)</div></div>`).join('');
    } else if(q.type==='rating'||q.type==='number'){
      const nums=as.map(a=>Number(a.value_number)).filter(n=>!isNaN(n));
      const avg=nums.length?(nums.reduce((x,y)=>x+y,0)/nums.length).toFixed(2):'—';
      const dist={}; nums.forEach(n=>dist[n]=(dist[n]||0)+1);
      html+=`<p class="muted">Average: <strong>${avg}</strong></p>`+Object.keys(dist).sort((a,b)=>a-b).map(k=>`<div class="rowstat"><div class="lbl">${k}</div><div class="bar"><span style="width:${dist[k]/Math.max(...Object.values(dist))*100}%"></span></div><div class="val">${dist[k]}</div></div>`).join('');
    } else if(q.type==='long_text'||q.type==='short_text'){
      const txt=as.map(a=>a.value).filter(Boolean);
      textQs.push({qid:q.id,label:q.label,texts:txt});
      html+=`<div id="th_${q.id}">${txt.length?'<div class="muted">Summarising themes…</div>':'<div class="muted">No text answers.</div>'}</div>`;
      if(txt.length) html+=`<div style="margin-top:8px"><a class="muted" style="font-size:12px;cursor:pointer" onclick="toggleResp('${q.id}')" id="resptoggle_${q.id}">▸ show all ${txt.length} responses</a><div id="resp_${q.id}" class="txtlist" style="display:none;margin-top:8px">${txt.map(t=>`<div>${esc(t)}</div>`).join('')}</div></div>`;
    } else {
      const txt=as.map(a=>a.value).filter(Boolean);
      html+=`<div class="txtlist">${txt.slice(0,50).map(t=>`<div>${esc(t)}</div>`).join('')||'<div class="muted">No answers.</div>'}</div>`;
    }
    html+='</div>';
  });
  // compact digest for the strategic AI summary
  const dg=[];
  questions.forEach((q,qi)=>{
    if(q.type==='info'||q.type==='image') return;
    const as=byQ[q.id]||[];
    if(CHOICE.has(q.type)||q.type==='yes_no'){
      const opts=q.type==='yes_no'?[{label:'Yes'},{label:'No'}]:options.filter(o=>o.question_id===q.id);
      const tally={}; opts.forEach(o=>tally[o.label]=0);
      as.forEach(a=>{ (a.value_options||(a.value?[a.value]:[])).forEach(v=>{ tally[v]=(tally[v]||0)+1; }); });
      dg.push(`Q${qi} [${q.type}] ${q.label} — `+Object.entries(tally).map(([l,c])=>`${l}: ${c} (${as.length?Math.round(c/as.length*100):0}%)`).join('; '));
    } else if(q.type==='rating'||q.type==='number'){
      const nums=as.map(a=>Number(a.value_number)).filter(n=>!isNaN(n));
      const avg=nums.length?(nums.reduce((x,y)=>x+y,0)/nums.length).toFixed(2):'—';
      dg.push(`Q${qi} [${q.type}] ${q.label} — avg ${avg} (n=${nums.length})`);
    } else {
      const txt=as.map(a=>a.value).filter(Boolean);
      dg.push(`Q${qi} [text] ${q.label} — ${as.length} answers. Samples: ${txt.slice(0,8).map(t=>'"'+String(t).slice(0,140)+'"').join(' | ')}`);
    }
  });
  window._survDigest={title:current.title, n:total, digest:dg.join('\n')};
  body.innerHTML=html;
  textQs.forEach(t=>{ if(t.texts.length) genThemes(t.qid,t.label,t.texts); });
}
async function bearer(){ const { data:{ session:p } } = await portal.auth.getSession(); return 'Bearer '+(p?p.access_token:''); }
function mdToHtml(md){
  let h=esc(md||'');
  h=h.replace(/^\s*#{1,3}\s*(.+)$/gm,'<div style="font-size:15px;font-weight:700;margin:14px 0 6px;color:var(--green-d)">$1</div>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/^\s*[-*]\s+(.+)$/gm,'<li>$1</li>');
  h=h.replace(/(<li>[\s\S]*?<\/li>)/g,'<ul style="margin:4px 0 8px 18px;padding:0">$1</ul>').replace(/<\/ul>\s*<ul[^>]*>/g,'');
  h=h.replace(/\n{2,}/g,'<br><br>').replace(/\n/g,'<br>');
  return h;
}
async function surveySummary(){
  const btn=$('survaibtn'), out=$('survai');
  btn.disabled=true; btn.textContent='Analysing survey…';
  try{
    const r=await fetch('/.netlify/functions/pulse-ai',{method:'POST',headers:{'content-type':'application/json','Authorization':await bearer()},body:JSON.stringify(window._survDigest)});

const SENT={positive:'#4a9d5b',negative:'#c0483b',mixed:'#b7791f',neutral:'#9aa2a0'};
function themesHtml(d){
  if(!d) return '<div class="muted">No themes.</div>';
  const themes=(d.themes||[]).filter(t=>t&&t.label);
  if(!themes.length) return `<div class="muted">${esc(d.summary||d.raw||'No clear themes.')}</div>`;
  const max=Math.max(1,...themes.map(t=>Number(t.count)||0));
  let h=d.summary?`<p class="muted" style="margin:2px 0 10px">${esc(d.summary)}</p>`:'';
  h+='<div style="font-size:11.5px;letter-spacing:.05em;color:var(--muted);font-weight:600;margin-bottom:6px">KEY THEMES</div>';
  h+=themes.map(t=>{const c=Number(t.count)||0;return `<div class="rowstat"><div class="lbl">${esc(t.label)}</div><div class="bar"><span style="width:${c/max*100}%;background:${SENT[t.sentiment]||'var(--green-l)'}"></span></div><div class="val">${c}</div></div>`+(t.quote?`<div class="muted" style="font-size:12px;margin:-3px 0 9px 2px">“${esc(t.quote)}”</div>`:'');}).join('');
  return h;
}
async function genThemes(qid,label,texts){
  if(window._themes[qid]){ if($('th_'+qid)) $('th_'+qid).innerHTML=themesHtml(window._themes[qid]); return; }
  try{
    const r=await fetch('/.netlify/functions/pulse-ai',{method:'POST',headers:{'content-type':'application/json','Authorization':await bearer()},body:JSON.stringify({question:label,answers:texts})});
    const d=await r.json(); if(!r.ok) throw new Error(d.error||'failed');

  }catch(e){ if($('th_'+qid)) $('th_'+qid).innerHTML=`<div class="muted">Theme summary unavailable: ${esc(String(e.message||e))}</div>`; }
}
function toggleResp(qid){ const el=$('resp_'+qid), t=$('resptoggle_'+qid); if(!el)return; const open=el.style.display!=='none'; el.style.display=open?'none':'flex'; if(t) t.textContent=(open?'▸ show all ':'▾ hide ')+el.children.length+' responses'; }
async function exportPdf(){
  const btn=$('pdfbtn'); btn.disabled=true; btn.textContent='Preparing…';
  const withAI=$('pdf_ai').checked, withResp=$('pdf_resp').checked;

    const {questions,options,responses,answers}=await loadFull();

    const textList=questions.filter(q=>q.type==='long_text'||q.type==='short_text');
    await Promise.all(textList.map(async q=>{ if(window._themes[q.id])return; const texts=(byQ[q.id]||[]).map(a=>a.value).filter(Boolean); if(!texts.length){window._themes[q.id]={themes:[]};return;} try{const r=await fetch('/.netlify/functions/pulse-ai',{method:'POST',headers:{'content-type':'application/json','Authorization':await bearer()},body:JSON.stringify({question:q.label,answers:texts})}); const d=await r.json(); window._themes[q.id]=r.ok?d:{themes:[]};}catch(e){window._themes[q.id]={themes:[]};} }));

function pbars(rows){ const max=Math.max(1,...rows.map(r=>r.count)); return rows.map(r=>`<div class="r"><div class="l">${esc(String(r.label))}</div><div class="b"><span style="width:${r.count/max*100}%"></span></div><div class="v">${r.count}${r.pct!=null?' ('+r.pct+'%)':''}</div></div>`).join(''); }
function buildReport({questions,options,byQ,responses,summaryText,withAI,withResp}){
  const total=responses.length, date=new Date().toLocaleDateString('en-NZ',{day:'numeric',month:'long',year:'numeric'});
  let bd='';
  if(withAI && summaryText) bd+=`<div class="ai"><h2>AI summary</h2>${mdToHtml(summaryText)}</div>`;
  questions.forEach((q,qi)=>{
    if(q.type==='info'||q.type==='image') return;
    const as=byQ[q.id]||[];
    bd+=`<div class="q"><h3>${qi}. ${esc(q.label)} <span class="n">${as.length} answered</span></h3>`;
    if(CHOICE.has(q.type)||q.type==='yes_no'){
      const opts=q.type==='yes_no'?[{label:'Yes'},{label:'No'}]:options.filter(o=>o.question_id===q.id);
      const tally={}; opts.forEach(o=>tally[o.label]=0); as.forEach(a=>{(a.value_options||(a.value?[a.value]:[])).forEach(v=>{tally[v]=(tally[v]||0)+1;});});
      bd+=pbars(Object.entries(tally).map(([l,c])=>({label:l,count:c,pct:as.length?Math.round(c/as.length*100):0})));
    } else if(q.type==='rating'||q.type==='number'){
      const nums=as.map(a=>Number(a.value_number)).filter(n=>!isNaN(n)); const avg=nums.length?(nums.reduce((x,y)=>x+y,0)/nums.length).toFixed(2):'—';
      const dist={}; nums.forEach(n=>dist[n]=(dist[n]||0)+1);
      bd+=`<p class="avg">Average: <strong>${avg}</strong></p>`+pbars(Object.keys(dist).sort((a,b)=>a-b).map(k=>({label:k,count:dist[k]})));
    } else if(q.type==='long_text'||q.type==='short_text'){
      const d=window._themes[q.id]; const themes=((d&&d.themes)||[]).filter(t=>t&&t.label);
      if(d&&d.summary) bd+=`<p class="sum">${esc(d.summary)}</p>`;
      if(themes.length){ const max=Math.max(1,...themes.map(t=>Number(t.count)||0));
        bd+='<div class="th-h">Key themes</div>'+themes.map(t=>{const c=Number(t.count)||0;return `<div class="r"><div class="l">${esc(t.label)}</div><div class="b"><span style="width:${c/max*100}%"></span></div><div class="v">${c}</div></div>`+(t.quote?`<div class="quote">“${esc(t.quote)}”</div>`:'');}).join('');
      } else bd+='<p class="sum">No text answers.</p>';
      if(withResp){ const txt=as.map(a=>a.value).filter(Boolean); if(txt.length) bd+='<div class="th-h">All responses ('+txt.length+')</div>'+txt.map(t=>`<div class="ri">${esc(t)}</div>`).join(''); }
    } else { const txt=as.map(a=>a.value).filter(Boolean); bd+=txt.slice(0,80).map(t=>`<div class="ri">${esc(t)}</div>`).join(''); }
    bd+='</div>';
  });
  return `<!doctype html><html><head><meta charset="utf-8"><title>${esc(current.title)} — Pulse report</title><style>
    *{box-sizing:border-box} body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#243029;margin:0}
    .page{max-width:820px;margin:0 auto;padding:36px 40px}
    .hd{border-bottom:3px solid #1f6f54;padding-bottom:14px;margin-bottom:22px}
    .hd .brand{color:#1f6f54;font-weight:700;letter-spacing:.08em;font-size:12px}
    .hd h1{margin:6px 0 4px;font-size:24px} .hd .meta{color:#6b7b72;font-size:13px}
    .ai{background:#eef5f0;border:1px solid #cfe6d8;border-radius:12px;padding:16px 20px;margin-bottom:24px;font-size:13.5px;line-height:1.55}
    .ai h2{margin:0 0 8px;font-size:16px;color:#16543f}
    .q{margin-bottom:20px;page-break-inside:avoid} .q h3{font-size:15px;margin:0 0 10px} .q .n{color:#6b7b72;font-weight:400;font-size:12px}
    .r{display:flex;align-items:center;gap:10px;margin:4px 0;font-size:13px} .r .l{width:44%} .r .b{flex:1;height:14px;background:#eef0ec;border-radius:5px;overflow:hidden} .r .b span{display:block;height:100%;background:#2f8a6a} .r .v{width:82px;text-align:right;color:#6b7b72}
    .avg{color:#6b7b72;font-size:13px;margin:0 0 6px} .sum{font-size:13px;color:#3a463f;margin:0 0 8px}
    .th-h{font-size:11px;letter-spacing:.05em;color:#6b7b72;font-weight:700;margin:10px 0 6px}
    .quote{color:#6b7b72;font-size:12px;margin:-2px 0 8px 2px} .ri{background:#f7f6f1;border-radius:7px;padding:6px 9px;font-size:12px;margin:4px 0}
    @media print{.page{padding:16px 20px}}
  </style></head><body><div class="page">
    <div class="hd"><div class="brand">REVIVE · PULSE</div><h1>${esc(current.title)}</h1><div class="meta">${total} responses · generated ${date}</div></div>
    ${bd}
  </div></body></html>`;
}

      <td><code>${esc(url)}</code></td>
      <td>${counts[c.id]||0}</td>
      <td><input type="checkbox" ${c.active?'checked':''} onchange="colActive('${c.id}',this.checked)"></td>
      <td><button class="btn small" onclick="copyTxt('${url}')">Copy</button></td>
    </tr>`; }).join('')||'<tr><td colspan="5" class="muted" style="padding:14px">No collectors yet. Add one to get a shareable link.</td></tr>';
  h+='</tbody></table></div>';
  $('tabbody').innerHTML=h;
}
function gen6(){ return String(Math.floor(100000+Math.random()*900000)); }
async function addCollector(){
  const label=(prompt('Label for this collector (e.g. "Repeat Customers"):')||'').trim();
  for(let a=0;a<5;a++){ const code=gen6();
    const { error }=await sb.from('collectors').insert({survey_id:current.id,code,label});
    if(!error){ toast('Collector created'); return renderCollectors(); } }
  toast('Could not generate a unique code, try again');
}
async function colLabel(id,v){ await sb.from('collectors').update({label:v}).eq('id',id); toast('Saved'); }
async function colActive(id,v){ await sb.from('collectors').update({active:v}).eq('id',id); toast(v?'Active':'Disabled'); }

// ---------- DRAW ----------
async function renderDraw(){
  const { data:draws }=await sb.from('draws').select('*').eq('survey_id',current.id).order('drawn_at',{ascending:false});
  const { data:winners }=await sb.from('responses').select('*').eq('survey_id',current.id).eq('is_winner',true);
  let h=`<div class="card"><p class="sub">Prize: <strong>${esc(current.draw_prize||'—')}</strong> • Mode: ${esc(current.draw_mode)}</p>
    <button class="btn primary" onclick="drawWinner()">🎲 Draw a winner now</button>
    <p class="muted" style="margin-top:8px">Picks a random entry with a valid email that hasn't already won.</p></div>`;
  h+=`<div class="card"><div class="qh">Winners</div>`+((winners&&winners.length)?winners.map(w=>`<div class="rowstat"><div class="lbl">${esc(w.respondent_name||'—')}</div><div style="flex:1">${esc(w.respondent_email||'')}</div><div class="val">${w.drawn_at?new Date(w.drawn_at).toLocaleDateString('en-NZ'):''}</div></div>`).join(''):'<p class="muted">No winners drawn yet.</p>')+'</div>';
  $('tabbody').innerHTML=h;
}
async function drawWinner(){
  const { data:pool }=await sb.from('responses').select('*').eq('survey_id',current.id).eq('is_winner',false).not('respondent_email','is',null);
  const valid=(pool||[]).filter(r=>r.respondent_email);
  if(!valid.length){ toast('No eligible entries'); return; }
  const w=valid[Math.floor(Math.random()*valid.length)];
  await sb.from('responses').update({is_winner:true,drawn_at:new Date().toISOString()}).eq('id',w.id);
  const period=current.draw_mode==='monthly'?new Date().toISOString().slice(0,7):'final';
  await sb.from('draws').insert({survey_id:current.id,period,winner_response_id:w.id,drawn_at:new Date().toISOString()});
  toast('Winner: '+(w.respondent_name||w.respondent_email));
  renderDraw();
}

// ---------- DELETE ----------
async function deleteSurvey(){
  if(!current) return;
  const cnt=listCounts[current.id]??0;
  if(!confirm(`Delete "${current.title}" and its ${cnt} response(s)? This permanently removes the survey, its questions, collector links and all responses. This cannot be undone.`)) return;
  const { error }=await sb.from('surveys').delete().eq('id',current.id);
  if(error){ toast('Delete failed: '+error.message); return; }
  toast('Survey deleted'); current=null;
  $('main').innerHTML='<div class="center">Survey deleted. Pick another survey on the left.</div>';
  await loadSurveys();
}

// ---------- STAFF & SETTINGS ----------
async function renderStaff(){
  current=null; document.querySelectorAll('.sitem').forEach(e=>e.classList.remove('active'));
  const { data:staff }=await sb.from('staff').select('*').order('sort_order');
  let h=`<h2>Staff &amp; settings</h2><p class="sub">Your front-of-house team. These names (and photos) are shown by any “staff” question in your surveys.</p><div class="card"><div id="stafflist">`;
  h+=(staff||[]).map(s=>`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      ${s.photo_url?`<img src="${esc(s.photo_url)}" style="width:46px;height:46px;border-radius:50%;object-fit:cover">`:'<div style="width:46px;height:46px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;font-size:20px">👤</div>'}
      <input value="${esc(s.name)}" onchange="staffName('${s.id}',this.value)" style="flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px">
      <label class="muted" style="font-size:12px;display:flex;align-items:center;gap:4px"><input type="checkbox" ${s.active?'checked':''} onchange="staffActive('${s.id}',this.checked)"> active</label>
      <label class="btn small" style="cursor:pointer">Photo<input type="file" accept="image/*" style="display:none" onchange="staffPhoto('${s.id}',this)"></label>
      <button class="btn small danger" onclick="staffDel('${s.id}')">✕</button>
    </div>`).join('');
  h+=`</div><button class="btn" onclick="staffAdd()">+ Add staff</button></div>`;
  $('main').innerHTML=h;
}
async function staffName(id,v){ await sb.from('staff').update({name:v}).eq('id',id); toast('Saved'); }
async function staffActive(id,v){ await sb.from('staff').update({active:v}).eq('id',id); toast(v?'Active':'Hidden'); }
async function staffAdd(){ const n=prompt('Staff name:'); if(!n||!n.trim())return; const {data:st}=await sb.from('staff').select('sort_order').order('sort_order',{ascending:false}).limit(1); const so=(st&&st[0]?st[0].sort_order:0)+1; await sb.from('staff').insert({name:n.trim(),sort_order:so}); renderStaff(); }
async function staffDel(id){ if(!confirm('Remove this staff member?'))return; await sb.from('staff').delete().eq('id',id); renderStaff(); }
async function staffPhoto(id,input){ const f=input.files&&input.files[0]; if(!f)return; toast('Uploading…');
  const ext=(f.name.split('.').pop()||'jpg').toLowerCase();
  const path='staff/'+id+'-'+Date.now()+'.'+ext;
  const {error}=await sb.storage.from('pulse-media').upload(path,f,{upsert:true,contentType:f.type});
  if(error){ toast('Upload failed: '+error.message); return; }
  const {data}=sb.storage.from('pulse-media').getPublicUrl(path);
  await sb.from('staff').update({photo_url:data.publicUrl}).eq('id',id); renderStaff(); toast('Photo set');
}

// ---------- NEW ----------
async function newSurvey(){
  const title=prompt('Survey title:'); if(!title)return;
  let slug=title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
  const {data,error}=await sb.from('surveys').insert({title,slug,type:'feedback',status:'draft',notify_emails:[]}).select().single();
  if(error){ toast('Error: '+error.message+' (slug may exist)'); return; }
  await loadSurveys(); openSurvey(data.id);
}
</script>
