<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jeremy Dixon — Songs</title>
<meta name="description" content="A small collection of songs.">
<meta name="theme-color" content="#0B1026">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Songs">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B1026;
    --ink-deep:#05081A;
    --paper:#F2EAD9;
    --muted:#868FB4;
    --gold:#E4B45E;
    --gold-dim:rgba(228,180,94,.28);
    --sheet:#0F1533;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--ink-deep);
    color:var(--paper);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    overscroll-behavior:none;
  }
  button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}

  /* ---- ambient backdrop: the current artwork, blurred behind everything ---- */
  #bg{position:fixed;inset:-18%;z-index:0;background-size:cover;background-position:center;
      filter:blur(70px) saturate(150%);opacity:.5;transition:background-image .6s,opacity .6s;transform:scale(1.1)}
  #bg-veil{position:fixed;inset:0;z-index:1;pointer-events:none;
      background:radial-gradient(120% 80% at 50% 8%,rgba(11,16,38,.35) 0%,rgba(11,16,38,.86) 48%,var(--ink-deep) 100%)}

  #app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
       max-width:520px;margin:0 auto;padding:0 26px;
       padding-top:max(18px,env(safe-area-inset-top));
       padding-bottom:max(18px,env(safe-area-inset-bottom))}

  /* ---- header ---- */
  header{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex:0 0 auto;padding:6px 2px 0}
  header h1{margin:0;font-family:'EB Garamond',Georgia,serif;font-weight:500;font-size:19px;letter-spacing:.01em}
  .tag{font-size:10.5px;letter-spacing:.09em;color:var(--gold);border:1px solid var(--gold-dim);
       padding:3px 8px;border-radius:100px;white-space:nowrap}

  /* ---- the arch: artwork in a chapel window frame ---- */
  .stage{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;padding:16px 0 6px}
  .arch{
    position:relative;width:min(74vw,300px);aspect-ratio:1/1.24;
    border-radius:50% 50% 14px 14px / 40% 40% 2% 2%;
    overflow:hidden;
    border:1px solid rgba(228,180,94,.34);
    box-shadow:0 30px 70px -18px rgba(0,0,0,.85), 0 0 90px -30px rgba(228,180,94,.4);
    background:#0d1230;
    animation:rise .9s cubic-bezier(.2,.7,.2,1) both;
  }
  .arch img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .45s}
  .arch::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.08) 0%,transparent 32%,rgba(5,8,26,.5) 100%)}
  @keyframes rise{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}

  /* ---- now playing ---- */
  .now{flex:0 0 auto;text-align:center;padding:14px 0 4px}
  .now h2{margin:0;font-family:'EB Garamond',Georgia,serif;font-weight:500;font-size:28px;line-height:1.18;letter-spacing:.005em}
  .now p{margin:6px 0 0;font-size:13px;color:var(--muted);letter-spacing:.02em}

  /* ---- scrubber ---- */
  .seek{flex:0 0 auto;padding:20px 0 0}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;display:block;margin:0;cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:3px;border-radius:3px;
    background:linear-gradient(to right,var(--gold) var(--pct,0%),rgba(242,234,217,.16) var(--pct,0%));
  }
  input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:rgba(242,234,217,.16)}
  input[type=range]::-moz-range-progress{height:3px;border-radius:3px;background:var(--gold)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--gold);
    margin-top:-4px;box-shadow:0 0 10px rgba(228,180,94,.7)}
  input[type=range]::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:var(--gold)}
  .times{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);
         font-variant-numeric:tabular-nums;margin-top:2px}

  /* ---- transport ---- */
  .transport{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:18px 4px 0}
  .transport button{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:var(--paper);
                    opacity:.62;transition:opacity .18s,transform .18s}
  .transport button:hover{opacity:1}
  .transport button:active{transform:scale(.9)}
  .transport button.on{opacity:1;color:var(--gold)}
  .transport svg{width:21px;height:21px;fill:currentColor}
  #play{width:66px;height:66px;opacity:1;background:var(--paper);color:var(--ink-deep);
        box-shadow:0 12px 30px -10px rgba(242,234,217,.5)}
  #play svg{width:26px;height:26px}

  /* ---- footer tabs ---- */
  .tabs{flex:0 0 auto;display:flex;justify-content:center;gap:30px;padding:22px 0 8px}
  .tabs button{font-size:12.5px;letter-spacing:.06em;color:var(--muted);padding:8px 4px;transition:color .18s}
  .tabs button:hover{color:var(--paper)}

  /* ---- sheets ---- */
  #scrim{position:fixed;inset:0;z-index:8;background:rgba(4,6,18,.6);backdrop-filter:blur(3px);
         opacity:0;pointer-events:none;transition:opacity .3s}
  #scrim.on{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:9;max-height:82vh;
    background:var(--sheet);border-radius:22px 22px 0 0;
    border-top:1px solid rgba(228,180,94,.2);
    box-shadow:0 -24px 60px -20px rgba(0,0,0,.9);
    transform:translateY(101%);transition:transform .36s cubic-bezier(.3,.8,.3,1);
    display:flex;flex-direction:column;max-width:520px;margin:0 auto;
    padding-bottom:max(10px,env(safe-area-inset-bottom));
  }
  .sheet.open{transform:translateY(0)}
  .grip{width:38px;height:4px;border-radius:4px;background:rgba(242,234,217,.22);margin:11px auto 4px;flex:0 0 auto}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 24px 12px;flex:0 0 auto}
  .sheet-head h3{margin:0;font-family:'EB Garamond',Georgia,serif;font-weight:500;font-size:21px}
  .sheet-head button{font-size:12.5px;color:var(--muted);padding:6px}
  .sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 24px 22px}

  /* ---- track list ---- */
  .row{display:flex;align-items:center;gap:14px;padding:11px 0;width:100%;text-align:left;
       border-bottom:1px solid rgba(242,234,217,.07)}
  .row:last-child{border-bottom:0}
  .row img{width:46px;height:46px;border-radius:6px;object-fit:cover;flex:0 0 auto;
           border:1px solid rgba(228,180,94,.18)}
  .row .meta{flex:1 1 auto;min-width:0}
  .row .t{font-family:'EB Garamond',Georgia,serif;font-size:18px;line-height:1.25;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .s{font-size:11.5px;color:var(--muted);margin-top:2px}
  .row.playing .t{color:var(--gold)}
  .row .dur{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .bars{display:none;gap:2px;align-items:flex-end;height:14px;flex:0 0 auto;width:14px}
  .row.playing .bars{display:flex}
  .row.playing .dur{display:none}
  .bars i{width:2.5px;background:var(--gold);border-radius:2px;animation:eq .9s ease-in-out infinite}
  .bars i:nth-child(1){height:40%;animation-delay:-.5s}
  .bars i:nth-child(2){height:100%;animation-delay:-.2s}
  .bars i:nth-child(3){height:65%}
  @keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
  .row.playing.paused .bars i{animation-play-state:paused}

  /* ---- lyrics ---- */
  .lyrics{font-family:'EB Garamond',Georgia,serif;font-size:23px;line-height:1.55;text-align:center;
          padding:8px 0 40vh}
  .lyrics p{margin:0 0 4px;color:rgba(242,234,217,.3);transition:color .35s,opacity .35s;padding:5px 0}
  .lyrics p.live{color:var(--paper)}
  .lyrics.static p{color:rgba(242,234,217,.78)}
  .lyrics p.blank{height:14px}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:34px 10px 44px;line-height:1.6}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.05s !important}
  }
  @media (max-height:680px){
    .arch{width:min(56vw,230px)}
    .now h2{font-size:24px}
    #play{width:60px;height:60px}
    .tabs{padding:14px 0 4px}
  }
</style>
</head>
<body>

<div id="bg"></div>
<div id="bg-veil"></div>

<div id="app">
  <header>
    <h1>Jeremy Dixon</h1>
    <span class="tag">Preview build</span>
  </header>

  <div class="stage">
    <div class="arch"><img id="art" alt="" src=""></div>
  </div>

  <div class="now">
    <h2 id="title">—</h2>
    <p id="sub">—</p>
  </div>

  <div class="seek">
    <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
    <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  </div>

  <div class="transport">
    <button id="shuffle" title="Shuffle" aria-label="Shuffle">
      <svg viewBox="0 0 24 24"><path d="M18 4l4 3-4 3V8h-2.2c-1 0-1.6.4-2.3 1.4l-.9 1.3-1.2-1.7.7-1C13.2 6.4 14.3 6 15.8 6H18V4zm0 10l4 3-4 3v-2h-2.2c-1.6 0-2.7-.5-3.7-1.9l-4-5.7C7.4 9.4 6.9 9 5.9 9H2V7h3.9c1.6 0 2.7.5 3.7 1.9l4 5.7c.6.9 1.2 1.4 2.2 1.4H18v-2zM2 15h3.9c1 0 1.5-.4 2.2-1.4l.7-1 1.2 1.7-.9 1.3C8.2 17.1 7.1 17.5 5.6 17.5H2v-2.5z"/></svg>
    </button>
    <button id="prev" title="Previous" aria-label="Previous track">
      <svg viewBox="0 0 24 24"><path d="M7 6h2v12H7zm12 0v12l-9-6z"/></svg>
    </button>
    <button id="play" title="Play" aria-label="Play">
      <svg id="playicon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button id="next" title="Next" aria-label="Next track">
      <svg viewBox="0 0 24 24"><path d="M15 6h2v12h-2zM5 6l9 6-9 6z"/></svg>
    </button>
    <button id="repeat" title="Repeat" aria-label="Repeat">
      <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
    </button>
  </div>

  <div class="tabs">
    <button id="openLyrics">Lyrics</button>
    <button id="openList">All songs</button>
  </div>
</div>

<div id="scrim"></div>

<div class="sheet" id="listSheet" role="dialog" aria-label="All songs">
  <div class="grip"></div>
  <div class="sheet-head"><h3>All songs</h3><button class="close">Close</button></div>
  <div class="sheet-body" id="list"></div>
</div>

<div class="sheet" id="lyricSheet" role="dialog" aria-label="Lyrics">
  <div class="grip"></div>
  <div class="sheet-head"><h3 id="lyricTitle">Lyrics</h3><button class="close">Close</button></div>
  <div class="sheet-body" id="lyricBody"></div>
</div>

<audio id="audio" preload="metadata" playsinline></audio>

<script>
/* ------------------------------------------------------------------
   TRACKS
   Placeholder audio + art until the real Suno songs are loaded in.
   `lyrics` is optional:
     - array of {t, line}  -> karaoke, highlights in time with the song
     - a plain string      -> shown as static text, no timing
     - omitted             -> lyrics tab shows an empty state
------------------------------------------------------------------- */
const TRACKS = [
  {
    title:"First Light",
    src:"audio/t1.mp3", art:"art/t1.jpg",
    lyrics:[
      {t:3.0,  line:"Amazing grace, how sweet the sound"},
      {t:8.5,  line:"That saved a wretch like me"},
      {t:14.0, line:"I once was lost, but now am found"},
      {t:19.5, line:"Was blind, but now I see"},
      {t:25.0, line:""},
      {t:27.0, line:"’Twas grace that taught my heart to fear"},
      {t:32.5, line:"And grace my fears relieved"},
      {t:38.0, line:"How precious did that grace appear"},
      {t:43.0, line:"The hour I first believed"}
    ]
  },
  {
    title:"Still Waters",
    src:"audio/t2.mp3", art:"art/t2.jpg",
    lyrics:"Sample of unsynced lyrics.\n\nWhen a song has no line timings,\nthe words simply sit here as text\nfor people to read while they listen.\n\nEverything else in the player works\nexactly the same way."
  },
  { title:"Evening Vigil", src:"audio/t3.mp3", art:"art/t3.jpg" },
  { title:"Homeward",      src:"audio/t4.mp3", art:"art/t4.jpg" }
];

const ALBUM = "Songs";
const ARTIST = "Jeremy Dixon";

/* ---------------- state ---------------- */
const audio = document.getElementById('audio');
let idx = 0, shuffle = false, repeat = 'off', queue = TRACKS.map((_,i)=>i), scrubbing = false;

const $ = id => document.getElementById(id);
const fmt = s => (!isFinite(s)||s<0) ? '0:00' : Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const abs = p => new URL(p, location.href).href;

/* ---------------- rendering ---------------- */
function paint(){
  const t = TRACKS[idx];
  $('art').src = t.art;
  $('art').alt = t.title + ' cover art';
  $('bg').style.backgroundImage = `url("${t.art}")`;
  $('title').textContent = t.title;
  $('sub').textContent = ARTIST;
  document.title = t.title + ' — ' + ARTIST;
  buildList();
  buildLyrics();
  setMediaSession();
}

function buildList(){
  const wrap = $('list');
  wrap.innerHTML = '';
  TRACKS.forEach((t,i)=>{
    const b = document.createElement('button');
    b.className = 'row' + (i===idx ? ' playing' : '') + (i===idx && audio.paused ? ' paused' : '');
    b.innerHTML = `<img src="${t.art}" alt="">
      <span class="meta"><span class="t">${t.title}</span><span class="s">${t.lyrics?'With lyrics':'Instrumental'}</span></span>
      <span class="bars"><i></i><i></i><i></i></span>
      <span class="dur" data-i="${i}">—</span>`;
    b.addEventListener('click', ()=>{ select(i); closeSheets(); });
    wrap.appendChild(b);
  });
  measure();
}

/* read each file's real duration once, so the list isn't hardcoded */
const durations = {};
function measure(){
  TRACKS.forEach((t,i)=>{
    const cell = document.querySelector(`.dur[data-i="${i}"]`);
    if(!cell) return;
    if(durations[i]!=null){ cell.textContent = fmt(durations[i]); return; }
    const probe = new Audio();
    probe.preload = 'metadata';
    probe.src = t.src;
    probe.addEventListener('loadedmetadata', ()=>{
      durations[i] = probe.duration;
      const c = document.querySelector(`.dur[data-i="${i}"]`);
      if(c) c.textContent = fmt(probe.duration);
    });
  });
}

function buildLyrics(){
  const t = TRACKS[idx], body = $('lyricBody');
  $('lyricTitle').textContent = t.title;
  body.innerHTML = '';
  if(Array.isArray(t.lyrics)){
    const d = document.createElement('div');
    d.className = 'lyrics';
    t.lyrics.forEach((l,i)=>{
      const p = document.createElement('p');
      p.dataset.t = l.t; p.dataset.i = i;
      if(l.line === ''){ p.className = 'blank'; } else { p.textContent = l.line; }
      d.appendChild(p);
    });
    body.appendChild(d);
  } else if(typeof t.lyrics === 'string'){
    const d = document.createElement('div');
    d.className = 'lyrics static';
    t.lyrics.split('\n').forEach(line=>{
      const p = document.createElement('p');
      if(line.trim()==='') p.className = 'blank'; else p.textContent = line;
      d.appendChild(p);
    });
    body.appendChild(d);
  } else {
    body.innerHTML = '<div class="empty">This one is instrumental —<br>no words to follow.</div>';
  }
}

let liveLine = -1;
function syncLyrics(){
  const t = TRACKS[idx];
  if(!Array.isArray(t.lyrics) || !$('lyricSheet').classList.contains('open')) return;
  let n = -1;
  for(let i=0;i<t.lyrics.length;i++){ if(audio.currentTime >= t.lyrics[i].t) n = i; else break; }
  if(n === liveLine) return;
  liveLine = n;
  const ps = $('lyricBody').querySelectorAll('p');
  ps.forEach(p=>p.classList.remove('live'));
  if(n>=0 && ps[n]){
    ps[n].classList.add('live');
    ps[n].scrollIntoView({block:'center', behavior:'smooth'});
  }
}

/* ---------------- playback ---------------- */
function select(i, autoplay=true){
  idx = i;
  audio.src = TRACKS[idx].src;
  liveLine = -1;
  paint();
  if(autoplay) audio.play().catch(()=>{});
}

function nextIndex(step){
  if(shuffle){
    if(TRACKS.length < 2) return idx;
    let n; do { n = Math.floor(Math.random()*TRACKS.length); } while(n === idx);
    return n;
  }
  return (idx + step + TRACKS.length) % TRACKS.length;
}

$('play').addEventListener('click', ()=> audio.paused ? audio.play() : audio.pause());
$('next').addEventListener('click', ()=> select(nextIndex(1)));
$('prev').addEventListener('click', ()=>{
  if(audio.currentTime > 3){ audio.currentTime = 0; return; }
  select(nextIndex(-1));
});
$('shuffle').addEventListener('click', e=>{
  shuffle = !shuffle;
  e.currentTarget.classList.toggle('on', shuffle);
  e.currentTarget.setAttribute('aria-pressed', shuffle);
});
$('repeat').addEventListener('click', e=>{
  repeat = repeat === 'off' ? 'all' : repeat === 'all' ? 'one' : 'off';
  e.currentTarget.classList.toggle('on', repeat !== 'off');
  e.currentTarget.title = 'Repeat: ' + repeat;
  e.currentTarget.style.opacity = repeat === 'one' ? '1' : '';
});

audio.addEventListener('play', ()=>{
  $('playicon').innerHTML = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
  $('play').setAttribute('aria-label','Pause');
  buildList();
});
audio.addEventListener('pause', ()=>{
  $('playicon').innerHTML = '<path d="M8 5v14l11-7z"/>';
  $('play').setAttribute('aria-label','Play');
  buildList();
});
audio.addEventListener('ended', ()=>{
  if(repeat === 'one'){ audio.currentTime = 0; audio.play(); return; }
  if(!shuffle && repeat === 'off' && idx === TRACKS.length - 1){
    select(0, false); return;
  }
  select(nextIndex(1));
});
audio.addEventListener('loadedmetadata', ()=>{
  $('dur').textContent = fmt(audio.duration);
  durations[idx] = audio.duration;
  const c = document.querySelector(`.dur[data-i="${idx}"]`);
  if(c) c.textContent = fmt(audio.duration);
});
audio.addEventListener('timeupdate', ()=>{
  if(!scrubbing && audio.duration){
    const pct = audio.currentTime / audio.duration * 1000;
    $('seek').value = pct;
    $('seek').style.setProperty('--pct', (pct/10) + '%');
    $('cur').textContent = fmt(audio.currentTime);
  }
  syncLyrics();
  updatePosition();
});

const seek = $('seek');
['mousedown','touchstart'].forEach(e=>seek.addEventListener(e, ()=> scrubbing = true));
seek.addEventListener('input', ()=>{
  seek.style.setProperty('--pct', (seek.value/10) + '%');
  if(audio.duration) $('cur').textContent = fmt(seek.value/1000 * audio.duration);
});
seek.addEventListener('change', ()=>{
  if(audio.duration) audio.currentTime = seek.value/1000 * audio.duration;
  scrubbing = false;
});

/* ---------------- native lock-screen / headphone controls ---------------- */
function setMediaSession(){
  if(!('mediaSession' in navigator)) return;
  const t = TRACKS[idx];
  navigator.mediaSession.metadata = new MediaMetadata({
    title: t.title, artist: ARTIST, album: ALBUM,
    artwork: [96,192,256,384,512,1000].map(s=>({src: abs(t.art), sizes: s+'x'+s, type:'image/jpeg'}))
  });
  const set = (a,fn)=>{ try{ navigator.mediaSession.setActionHandler(a, fn); }catch(e){} };
  set('play',  ()=>audio.play());
  set('pause', ()=>audio.pause());
  set('previoustrack', ()=>{ if(audio.currentTime>3){audio.currentTime=0;} else select(nextIndex(-1)); });
  set('nexttrack', ()=>select(nextIndex(1)));
  set('seekbackward', d=>{ audio.currentTime = Math.max(0, audio.currentTime - (d.seekOffset||10)); });
  set('seekforward',  d=>{ audio.currentTime = Math.min(audio.duration, audio.currentTime + (d.seekOffset||10)); });
  set('seekto', d=>{ if(d.fastSeek && audio.fastSeek){ audio.fastSeek(d.seekTime); return; } audio.currentTime = d.seekTime; });
  set('stop', ()=>{ audio.pause(); audio.currentTime = 0; });
}
function updatePosition(){
  if(!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
  if(!audio.duration || !isFinite(audio.duration)) return;
  try{
    navigator.mediaSession.setPositionState({
      duration: audio.duration,
      playbackRate: audio.playbackRate,
      position: Math.min(audio.currentTime, audio.duration)
    });
  }catch(e){}
}
audio.addEventListener('play',  ()=>{ if('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing'; });
audio.addEventListener('pause', ()=>{ if('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused'; });

/* ---------------- sheets ---------------- */
function openSheet(el){
  closeSheets();
  el.classList.add('open');
  $('scrim').classList.add('on');
  if(el.id === 'lyricSheet'){ liveLine = -1; syncLyrics(); }
}
function closeSheets(){
  document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open'));
  $('scrim').classList.remove('on');
}
$('openList').addEventListener('click', ()=>openSheet($('listSheet')));
$('openLyrics').addEventListener('click', ()=>openSheet($('lyricSheet')));
$('scrim').addEventListener('click', closeSheets);
document.querySelectorAll('.sheet .close').forEach(b=>b.addEventListener('click', closeSheets));
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape') closeSheets();
  if(e.code === 'Space' && e.target === document.body){ e.preventDefault(); audio.paused ? audio.play() : audio.pause(); }
});

/* swipe a sheet down to close */
document.querySelectorAll('.sheet').forEach(sh=>{
  let y0 = null;
  sh.addEventListener('touchstart', e=>{ if(sh.querySelector('.sheet-body').scrollTop <= 0) y0 = e.touches[0].clientY; }, {passive:true});
  sh.addEventListener('touchmove', e=>{
    if(y0 === null) return;
    const dy = e.touches[0].clientY - y0;
    if(dy > 0) sh.style.transform = `translateY(${dy}px)`;
  }, {passive:true});
  sh.addEventListener('touchend', e=>{
    if(y0 === null) return;
    const dy = e.changedTouches[0].clientY - y0;
    sh.style.transform = '';
    if(dy > 90) closeSheets();
    y0 = null;
  });
});

/* ---------------- go ---------------- */
audio.src = TRACKS[0].src;
paint();
</script>
</body>
</html>
