<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Inspiration Project</title>
<meta name="description" content="A collection of songs.">
<meta name="theme-color" content="#0A0A0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Inspiration Project">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0B;
    --panel:#141417;
    --text:#FFFFFF;
    --muted:#A0A0AC;
    --dim:#6B6B78;
    --accent:#2BD97C;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;
  }
  button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  #app{position:relative;height:100%;overflow:hidden;display:flex;flex-direction:column;
       max-width:620px;margin:0 auto}

  /* ══════════ TOP: artwork with the lyrics running over it ══════════ */
  .stage{position:relative;flex:0 0 auto;height:min(36vh,330px);overflow:hidden;background:#111}
  .stage img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.02)}
  .stage::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(6,6,8,.86) 0%,rgba(6,6,8,.5) 42%,rgba(6,6,8,.15) 66%,var(--bg) 100%)}

  .flowwrap{position:absolute;left:0;right:0;overflow:hidden;z-index:2;pointer-events:none;
            top:calc(env(safe-area-inset-top, 0px) + 34px);
            height:60%;
            -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 74%,transparent 100%);
            mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 74%,transparent 100%)}
  .flow{position:absolute;left:22px;right:22px;top:0;transition:transform .5s cubic-bezier(.25,.8,.3,1)}
  .flow p{margin:0;padding:7px 0;font-size:20px;font-weight:600;line-height:1.34;
          color:rgba(255,255,255,.34);transition:color .35s,transform .35s;
          text-shadow:0 2px 16px rgba(0,0,0,.8)}
  .flow p.live{color:#fff;transform:scale(1.03);transform-origin:left center}
  .flow.off{display:none}

  .stagebtns{position:absolute;right:12px;bottom:10px;z-index:3;display:flex;gap:10px}
  .stagebtns button{width:58px;height:58px;display:grid;place-items:center;border-radius:50%;
                    background:rgba(10,10,12,.62);backdrop-filter:blur(6px);color:#fff;opacity:.92}
  .stagebtns button:hover{opacity:1;background:rgba(10,10,12,.8)}
  .stagebtns button:active{transform:scale(.9)}
  .stagebtns button.off{color:var(--dim)}
  .stagebtns svg{width:29px;height:29px;fill:currentColor}

  /* ══════════ MIDDLE: track meta + controls ══════════ */
  .deck{flex:0 0 auto;padding:14px 22px 12px}
  .titlerow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .titlerow .meta{min-width:0;flex:1 1 auto}
  .deck h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.015em;line-height:1.2;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .heart{flex:0 0 auto;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;
         color:var(--muted);background:rgba(255,255,255,.06);transition:color .18s,transform .18s,background .18s}
  .heart svg{width:27px;height:27px;fill:currentColor}
  .heart:hover{background:rgba(255,255,255,.12)}
  .heart.on{color:#FF4D6D;background:rgba(255,77,109,.14)}
  .heart.pop{transform:scale(1.22)}
  .deck .artist{margin:4px 0 0;font-size:13px;color:var(--muted);font-weight:500;line-height:1.35}
  .deck .note{margin:8px 0 0;font-size:12.5px;line-height:1.45;color:var(--muted);font-weight:400}
  .verse{display:inline-flex;align-items:center;gap:5px;margin-top:8px;
         font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;
         border:1px solid rgba(43,217,124,.4);border-radius:100px;padding:8px 15px;
         transition:background .15s;cursor:pointer}
  .verse:hover{background:rgba(43,217,124,.12)}
  .verse svg{width:11px;height:11px;fill:currentColor;opacity:.8}

  .seekrow{margin-top:14px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;
                    background:transparent;display:block;margin:0;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;
    background:linear-gradient(to right,var(--accent) var(--pct,0%),rgba(255,255,255,.2) var(--pct,0%))}
  input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:rgba(255,255,255,.2)}
  input[type=range]::-moz-range-progress{height:8px;border-radius:8px;background:var(--accent)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
    background:#fff;margin-top:-7px;box-shadow:0 2px 8px rgba(0,0,0,.55)}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff}
  .times{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);
         font-variant-numeric:tabular-nums;margin-top:0}

  .transport{display:flex;align-items:center;justify-content:space-between;padding:12px 0 2px;gap:4px}
  .transport button{display:grid;place-items:center;width:60px;height:60px;border-radius:50%;
                    color:var(--text);opacity:.8;transition:opacity .15s,transform .15s,background .15s;
                    background:rgba(255,255,255,.06)}
  .transport button:hover{opacity:1;background:rgba(255,255,255,.12)}
  .transport button:active{transform:scale(.9)}
  .transport button.on{color:var(--accent);opacity:1;background:rgba(43,217,124,.16)}
  .transport svg{width:30px;height:30px;fill:currentColor}
  #prev svg,#next svg{width:34px;height:34px}
  #play{width:82px;height:82px;background:var(--accent);color:#06210F;opacity:1}
  #play:hover{background:#3ce68b}
  #play svg{width:40px;height:40px}
  .rpt{position:relative}
  .rpt .one{position:absolute;top:8px;right:9px;font-size:10px;font-weight:700;color:var(--accent);display:none}
  .rpt.one-on .one{display:block}

  /* ══════════ BOTTOM: tiles ══════════ */
  .library{position:absolute;left:0;right:0;bottom:0;top:60%;
           display:flex;flex-direction:column;z-index:5;
           background:var(--panel);border-radius:16px 16px 0 0;
           border-top:1px solid rgba(255,255,255,.08);
           box-shadow:0 -20px 44px -22px rgba(0,0,0,.9);
           transition:top .4s cubic-bezier(.32,.85,.3,1)}
  .libgrip{width:34px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);
           margin:8px auto 0;flex:0 0 auto;transition:background .2s}
  .library.expanded .libgrip{background:var(--accent);opacity:.7}
  .libhead{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
           padding:10px 20px 10px;cursor:pointer;touch-action:none}
  .libhead h3{margin:0;font-size:15px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
  .libhead button{font-size:14px;font-weight:600;color:var(--accent);padding:10px 4px}
  .libleft{display:flex;align-items:center;gap:14px;min-width:0}
  .libtools{display:flex;align-items:center;gap:16px}
  #favFilter{color:var(--muted);display:flex;align-items:center;gap:6px}
  #favFilter svg{width:18px;height:18px;fill:currentColor}
  #favFilter.on{color:#FF4D6D}
  .emptyfav{grid-column:1/-1;text-align:center;color:var(--dim);font-size:14px;
            line-height:1.6;padding:34px 16px}
  #askBtn{color:var(--accent);display:flex;align-items:center;gap:6px;padding:10px 2px;
          font-weight:600;font-size:14px;white-space:nowrap}
  #askBtn svg{width:17px;height:17px;fill:currentColor}
  @media (max-width:380px){
    .libleft{gap:10px}
    #favFilter span{display:none}
  }
  #viewToggle{color:var(--muted);display:flex;align-items:center;padding:10px 4px}
  #viewToggle svg{width:20px;height:20px;fill:currentColor}

  /* list mode: one row per song */
  .grid.list{display:block;padding:2px 12px 26px}
  .grid.list .tile{flex-direction:row;align-items:center;gap:12px;padding:9px 2px 9px 4px;
                   border-bottom:1px solid rgba(255,255,255,.06)}
  .grid.list .tile:last-child{border-bottom:0}
  .grid.list .hit{display:flex;align-items:center;gap:13px;flex:1 1 auto;min-width:0}
  .grid.list .thumb{width:56px;height:56px;flex:0 0 auto}
  .grid.list .rowmeta{display:block;flex:1 1 auto;min-width:0;overflow:hidden}
  .grid.list .tt{display:block;margin-top:0;font-size:15.5px;line-height:1.25;
                 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grid.list .tn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
                 margin-top:3px;font-size:11.5px;line-height:1.36;color:var(--dim);overflow:hidden}
  .grid.list .ts{display:none}
  .grid.list .tilefav{position:static;width:42px;height:42px;background:none;backdrop-filter:none}
  .rowmeta{display:contents}
  .libhead button:hover{color:var(--text)}
  .grid{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
        display:grid;grid-template-columns:repeat(2,1fr);gap:18px 14px;padding:2px 20px 26px}
  .library.expanded .grid{grid-template-columns:repeat(3,1fr)}
  @media (min-width:520px){.grid,.library.expanded .grid{grid-template-columns:repeat(4,1fr)}}
  .tile{position:relative;text-align:left;width:100%;display:flex;flex-direction:column;align-items:flex-start}
  .tilefav{position:absolute;top:4px;right:4px;z-index:3;width:38px;height:38px;border-radius:50%;
           display:grid;place-items:center;color:rgba(255,255,255,.75);
           background:rgba(8,8,10,.45);backdrop-filter:blur(4px);transition:color .18s,transform .18s}
  .tilefav svg{width:20px;height:20px;fill:currentColor}
  .tilefav.on{color:#FF4D6D}
  .tilefav.pop{transform:scale(1.25)}
  .tile .hit{text-align:left;width:100%;display:block}
  .tile .thumb{position:relative;width:100%;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#222}
  .tile .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s,filter .3s}
  .tile:hover .thumb img{transform:scale(1.05)}
  .tile .tt{margin-top:8px;font-size:14px;font-weight:600;line-height:1.3;
            display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tile .ts{font-size:12px;color:var(--dim);margin-top:3px;font-variant-numeric:tabular-nums}
  .tile .tn{font-size:11.5px;line-height:1.4;color:var(--muted);margin-top:5px;
            display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .tile .verse{margin-top:9px;font-size:12px;padding:7px 13px}
  .tile.playing .tt{color:var(--accent)}
  .tile.playing .thumb{outline:2px solid var(--accent);outline-offset:-2px}
  .tile.playing .thumb img{filter:brightness(.5)}
  .bars{position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:3px}
  .tile.playing .bars{display:flex}
  .bars i{width:3px;height:16px;background:var(--accent);border-radius:2px;
          animation:eq .85s ease-in-out infinite}
  .bars i:nth-child(1){animation-delay:-.5s}
  .bars i:nth-child(2){animation-delay:-.25s;height:22px}
  .bars i:nth-child(3){animation-delay:-.1s}
  @keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
  .tile.playing.paused .bars i{animation-play-state:paused;transform:scaleY(.45)}

  /* ══════════ full lyrics sheet ══════════ */
  #scrim{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.65);
         opacity:0;pointer-events:none;transition:opacity .28s}
  #scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;height:88vh;max-width:620px;margin:0 auto;
         background:#111114;border-radius:18px 18px 0 0;border-top:1px solid rgba(255,255,255,.08);
         transform:translateY(101%);transition:transform .34s cubic-bezier(.3,.8,.3,1);
         display:flex;flex-direction:column;padding-bottom:max(8px,env(safe-area-inset-bottom))}
  .sheet.open{transform:translateY(0)}
  .grip{width:36px;height:4px;border-radius:4px;background:rgba(255,255,255,.22);margin:10px auto 2px;flex:0 0 auto}
  .sheet-head{display:flex;align-items:flex-start;justify-content:space-between;padding:8px 22px 10px;flex:0 0 auto}
  .sheet-head h3{margin:0;font-size:16px;font-weight:700}
  .sheet-head .sub{font-size:11px;color:var(--dim);margin-top:2px;font-weight:500}
  .sheet-head button{font-size:12px;font-weight:600;color:var(--muted);padding:6px}
  .sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 22px 45vh}
  .full p{margin:0;padding:7px 0;font-size:19px;font-weight:600;line-height:1.4;
          color:rgba(255,255,255,.34);transition:color .3s}
  .full p.live{color:#fff}
  .full p.sect{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
               color:var(--accent);opacity:.7;padding:20px 0 4px}
  #verseSheet{height:auto;max-height:80vh}
  #askSheet{height:auto;max-height:92vh}
  #askSheet .sheet-body{padding-bottom:24px}
  .field{margin:14px 0 0}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 7px}
  .field input,.field textarea{width:100%;background:#1B1B20;color:#fff;border:1px solid rgba(255,255,255,.12);
    border-radius:11px;padding:14px 14px;font-family:inherit;font-size:16px;line-height:1.45;
    transition:border-color .15s}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
  .field textarea{min-height:132px;resize:vertical}
  .trap{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
  .askhint{margin:2px 0 0;font-size:12.5px;color:var(--dim);line-height:1.5}
  .send{width:100%;margin-top:20px;background:var(--accent);color:#06210F;font-weight:700;font-size:16px;
        border-radius:100px;padding:17px;transition:opacity .15s}
  .send:disabled{opacity:.5}
  .askmsg{margin:14px 0 0;font-size:13.5px;line-height:1.5;display:none}
  .askmsg.bad{display:block;color:#FF8095}
  .askdone{text-align:center;padding:26px 8px 12px;display:none}
  .askdone svg{width:52px;height:52px;fill:var(--accent);margin-bottom:14px}
  .askdone h4{margin:0 0 8px;font-size:19px;font-weight:700}
  .askdone p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}
  .scripture{margin:6px 0 0;font-size:19px;line-height:1.62;color:#fff;font-weight:400}
  .chapterlink{display:inline-block;margin:22px 0 6px;font-size:12.5px;font-weight:600;
               color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(43,217,124,.4);
               padding-bottom:2px}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.06s !important}}
  @media (max-height:700px){
    .stage{height:30vh}
    .flowwrap{top:calc(env(safe-area-inset-top, 0px) + 26px);height:62%}
    .flow p{font-size:17px;padding:5px 0}
    .deck{padding-top:8px}
    .deck .note{display:none}
    .transport{padding-top:8px}
    .transport button{width:54px;height:54px}
    #play{width:70px;height:70px}
    #play svg{width:34px;height:34px}
  }
</style>
</head>
<body>
<div id="app">

  <div class="stage" id="stage">
    <img id="art" src="" alt="">
    <div class="flowwrap"><div class="flow" id="flow"></div></div>
    <div class="stagebtns">
      <button id="lyricToggle" title="Hide lyrics" aria-label="Hide lyrics">
        <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 4h10v2H4zm0 4h13v2H4zm0 4h8v2H4z"/></svg>
      </button>
      <button id="expand" title="Full lyrics" aria-label="Full lyrics">
        <svg viewBox="0 0 24 24"><path d="M4 14h2v4h4v2H4v-6zm16-4h-2V6h-4V4h6v6z"/></svg>
      </button>
    </div>
  </div>

  <div class="deck">
    <div class="titlerow">
      <div class="meta">
        <h2 id="title">—</h2>
        <p class="artist" id="sub">Jeremy Dixon</p>
      </div>
      <button class="heart" id="fav" aria-label="Save to favourites"></button>
    </div>
    <p class="note" id="note"></p>
    <button class="verse" id="verse">
      <span id="verseRef"></span>
      <svg viewBox="0 0 24 24"><path d="M12 6.2C10.6 5.2 8.6 4.6 6 4.6c-1.1 0-2.1.1-3 .3v13.5c.9-.2 1.9-.3 3-.3 2.6 0 4.6.6 6 1.6 1.4-1 3.4-1.6 6-1.6 1.1 0 2.1.1 3 .3V4.9c-.9-.2-1.9-.3-3-.3-2.6 0-4.6.6-6 1.6zm0 11.1V8c-1.1-.7-2.7-1.2-4.9-1.2V16c1.9 0 3.5.5 4.9 1.3z"/></svg>
    </button>
    <div class="seekrow">
      <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>
    <div class="transport">
      <button id="shuffle" title="Shuffle" aria-label="Shuffle">
        <svg viewBox="0 0 24 24"><path d="M18 4l4 3-4 3V8h-2.2c-1 0-1.6.4-2.3 1.4l-.9 1.3-1.2-1.7.7-1C13.2 6.4 14.3 6 15.8 6H18V4zm0 10l4 3-4 3v-2h-2.2c-1.6 0-2.7-.5-3.7-1.9l-4-5.7C7.4 9.4 6.9 9 5.9 9H2V7h3.9c1.6 0 2.7.5 3.7 1.9l4 5.7c.6.9 1.2 1.4 2.2 1.4H18v-2zM2 15h3.9c1 0 1.5-.4 2.2-1.4l.7-1 1.2 1.7-.9 1.3C8.2 17.1 7.1 17.5 5.6 17.5H2v-2.5z"/></svg>
      </button>
      <button id="prev" title="Previous" aria-label="Previous track">
        <svg viewBox="0 0 24 24"><path d="M7 6h2v12H7zm12 0v12l-9-6z"/></svg>
      </button>
      <button id="play" title="Play" aria-label="Play">
        <svg id="playicon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="next" title="Next" aria-label="Next track">
        <svg viewBox="0 0 24 24"><path d="M15 6h2v12h-2zM5 6l9 6-9 6z"/></svg>
      </button>
      <button id="repeat" class="rpt" title="Repeat" aria-label="Repeat">
        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        <span class="one">1</span>
      </button>
    </div>
  </div>

  <div class="library" id="library">
    <div class="libgrip"></div>
    <div class="libhead" id="libhead">
      <div class="libleft">
        <h3 id="libcount">All songs</h3>
        <button id="askBtn"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 00-9 9c0 1.6.42 3.1 1.16 4.4L3 21l4.7-1.13A8.96 8.96 0 0012 21a9 9 0 000-18zm0 2a7 7 0 110 14 6.9 6.9 0 01-3.6-1l-.35-.2-2.2.53.54-2.14-.22-.36A6.9 6.9 0 0112 5z"/></svg>Song Request</button>
      </div>
      <div class="libtools">
        <button id="viewToggle" aria-label="Switch view"></button>
        <button id="favFilter" aria-pressed="false"></button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div id="scrim"></div>
<div class="sheet" id="askSheet" role="dialog" aria-label="Request a song">
  <div class="grip"></div>
  <div class="sheet-head">
    <div><h3>Request a song</h3><div class="sub">Tell Jeremy what to write about</div></div>
    <button class="close">Close</button>
  </div>
  <div class="sheet-body">
    <div id="askForm">
      <div class="field">
        <label for="askName">Your name</label>
        <input id="askName" type="text" maxlength="80" autocomplete="name" placeholder="Who's asking?">
      </div>
      <div class="field">
        <label for="askTheme">What would you like a song about?</label>
        <textarea id="askTheme" maxlength="1200" placeholder="A theme, a verse, a story, or something you're walking through."></textarea>
      </div>
      <input class="trap" id="askTrap" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
      <p class="askmsg" id="askMsg"></p>
      <button class="send" id="askSend">Send request</button>
      <p class="askhint">This goes straight to Jeremy's inbox. He won't get your email address, so mention it if you'd like a reply.</p>
    </div>
    <div class="askdone" id="askDone">
      <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm-1.2 14.6l-4.2-4.2 1.4-1.4 2.8 2.8 6-6 1.4 1.4-7.4 7.4z"/></svg>
      <h4>Sent</h4>
      <p>Thanks — Jeremy has your idea.</p>
    </div>
  </div>
</div>

<div class="sheet" id="verseSheet" role="dialog" aria-label="Scripture">
  <div class="grip"></div>
  <div class="sheet-head">
    <div><h3 id="vRef">Verse</h3><div class="sub" id="vVersion"></div></div>
    <button class="close">Close</button>
  </div>
  <div class="sheet-body">
    <p class="scripture" id="vText"></p>
    <a class="chapterlink" id="vChapter" href="#" target="_blank" rel="noopener">Read the whole chapter</a>
  </div>
</div>

<div class="sheet" id="lyricSheet" role="dialog" aria-label="Lyrics">
  <div class="grip"></div>
  <div class="sheet-head">
    <div><h3 id="sheetTitle">Lyrics</h3><div class="sub" id="sheetSub"></div></div>
    <button class="close">Close</button>
  </div>
  <div class="sheet-body"><div class="full" id="full"></div></div>
</div>

<audio id="audio" preload="metadata" playsinline></audio>

<script>
const $ = id => document.getElementById(id);
const audio = $('audio');
let SONGS = [], ARTIST = 'Jeremy Dixon - The Inspiration Project', ALBUM = 'The Inspiration Project';
let idx = 0, shuffle = false, repeat = 'off', scrubbing = false, lyricsOn = true, live = -1;
/* true whenever the listener wants sound. A phone call pauses the element without
   clearing this, which is how we know to pick things back up afterwards. */
let wantPlaying = false;

const fmt = s => (!isFinite(s) || s < 0) ? '0:00'
  : Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
const abs = p => new URL(p, location.href).href;
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ─────────── favourites, kept in this browser ─────────── */
const FAV_KEY = 'revive.music.favourites.v1';
const HEART_FULL = '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
const HEART_LINE = '<svg viewBox="0 0 24 24"><path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/></svg>';

let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]')); } catch(e){}
function saveFavs(){
  try { localStorage.setItem(FAV_KEY, JSON.stringify([...favs])); } catch(e){}
}
const isFav = s => s && favs.has(s.title);
function toggleFav(i){
  const s = SONGS[i];
  if(!s) return;
  if(favs.has(s.title)) favs.delete(s.title); else favs.add(s.title);
  saveFavs();
  paintFav();
  buildGrid();
}
function paintFav(){
  const s = SONGS[idx], on = isFav(s);
  const b = $('fav');
  b.innerHTML = on ? HEART_FULL : HEART_LINE;
  b.classList.toggle('on', on);
  b.setAttribute('aria-pressed', on);
  b.setAttribute('aria-label', on ? 'Remove from favourites' : 'Save to favourites');
  const v = $('viewToggle');
  v.innerHTML = listView ? ICON_GRID : ICON_LIST;
  v.title = listView ? 'Show thumbnails' : 'Show list';
  const f = $('favFilter');
  f.innerHTML = (favOnly ? HEART_FULL : HEART_LINE) + '<span>' + (favs.size || '') + ' Favourites</span>';
  f.classList.toggle('on', favOnly);
  f.setAttribute('aria-pressed', favOnly);
}
let favOnly = false;
const VIEW_KEY = 'revive.music.view.v1';
let listView = false;
try { listView = localStorage.getItem(VIEW_KEY) === 'list'; } catch(e){}
const ICON_LIST = '<svg viewBox="0 0 24 24"><path d="M3 5h4v4H3V5zm6 1h12v2H9V6zM3 10h4v4H3v-4zm6 1h12v2H9v-2zM3 15h4v4H3v-4zm6 1h12v2H9v-2z"/></svg>';
const ICON_GRID = '<svg viewBox="0 0 24 24"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></svg>';

/* Lyric times are stored against each song's true length. If the audio file that
   loads is a different length, scale so the words still land in the right place. */
function scale(){
  const s = SONGS[idx];
  if(!s || !s.duration || !audio.duration || !isFinite(audio.duration)) return 1;
  return audio.duration / s.duration;
}
const sung = s => (s.lines || []).filter(l => !l.sect);

/* ─────────── render ─────────── */
function paint(){
  const s = SONGS[idx];
  $('art').src = s.art;
  $('art').alt = s.title + ' cover';
  $('title').textContent = s.title;
  $('sub').textContent = ARTIST;
  $('note').textContent = s.note || '';
  $('note').style.display = s.note ? '' : 'none';
  if(s.verse && s.verse.ref){
    $('verseRef').textContent = s.verse.ref;
    $('verse').style.display = '';
  } else {
    $('verse').style.display = 'none';
  }
  document.title = s.title + ' — ' + ALBUM;
  buildFlow();
  buildFull();
  buildGrid();
  paintFav();
  mediaSession();
}

function flowOffset(i){
  const wrap = $('flow');
  const p = wrap.querySelectorAll('p')[i];
  if(!p) return 0;
  const wrapH = wrap.parentElement.clientHeight;
  return wrapH * 0.42 - (p.offsetTop + p.offsetHeight / 2);
}
/* park the flow on a line without animating into place */
function parkFlow(i){
  const wrap = $('flow');
  const prev = wrap.style.transition;
  wrap.style.transition = 'none';
  wrap.style.transform = 'translateY(' + flowOffset(i) + 'px)';
  void wrap.offsetHeight;
  wrap.style.transition = prev;
}

function buildFlow(){
  const wrap = $('flow'), s = SONGS[idx];
  wrap.innerHTML = '';
  const lines = sung(s);
  if(!lines.length){
    wrap.innerHTML = '<p>Instrumental</p>';
    return;
  }
  lines.forEach((l,i)=>{
    const p = document.createElement('p');
    p.textContent = l.text;
    p.dataset.i = i;
    wrap.appendChild(p);
  });
  live = -1;
  requestAnimationFrame(()=>{ if(live < 0) parkFlow(0); });
}

function buildFull(){
  const s = SONGS[idx], box = $('full');
  $('sheetTitle').textContent = s.title;
  $('sheetSub').textContent = ARTIST + (s.timing === 'estimated' ? ' · timings estimated' : '');
  box.innerHTML = '';
  (s.lines || []).forEach(l=>{
    const p = document.createElement('p');
    p.textContent = l.text;
    p.dataset.t = l.t;
    if(l.sect) p.className = 'sect';
    box.appendChild(p);
  });
}

function buildGrid(){
  const g = $('grid');
  g.innerHTML = '';
  g.classList.toggle('list', listView);
  const shown = SONGS.map((s,i)=>i).filter(i => !favOnly || isFav(SONGS[i]));
  $('libcount').textContent = favOnly
    ? shown.length + (shown.length === 1 ? ' favourite' : ' favourites')
    : SONGS.length + ' songs';
  if(!shown.length){
    g.innerHTML = '<p class="emptyfav">No favourites yet.<br>Tap the heart on a song to keep it here.</p>';
    return;
  }
  shown.forEach(i=>{
    const s = SONGS[i];
    const wrap = document.createElement('div');
    wrap.className = 'tile' + (i === idx ? ' playing' : '') + (i === idx && audio.paused ? ' paused' : '');

    const b = document.createElement('button');
    b.className = 'hit';
    b.setAttribute('aria-label', 'Play ' + s.title);
    const thumb = '<span class="thumb"><img src="' + s.art + '" alt="" loading="lazy">' +
      '<span class="bars"><i></i><i></i><i></i></span></span>';
    const text = '<span class="tt">' + esc(s.title) + '</span>' +
      '<span class="ts">' + fmt(s.duration) + '</span>' +
      (s.note ? '<span class="tn">' + esc(s.note) + '</span>' : '');
    b.innerHTML = listView ? thumb + '<span class="rowmeta">' + text + '</span>' : thumb + text;
    b.addEventListener('click', ()=>select(i));
    wrap.appendChild(b);
    const fb = document.createElement('button');
    fb.className = 'tilefav' + (isFav(s) ? ' on' : '');
    fb.innerHTML = isFav(s) ? HEART_FULL : HEART_LINE;
    fb.setAttribute('aria-label', (isFav(s) ? 'Remove ' : 'Save ') + s.title);
    fb.addEventListener('click', e=>{
      e.stopPropagation();
      fb.classList.add('pop');
      setTimeout(()=>fb.classList.remove('pop'), 180);
      toggleFav(i);
    });
    wrap.appendChild(fb);

    g.appendChild(wrap);
  });
}

/* ─────────── lyric scrolling ─────────── */
function runLyrics(){
  const s = SONGS[idx], lines = sung(s);
  if(!lines.length) return;
  const k = scale(), t = audio.currentTime;
  let n = -1;
  for(let i=0;i<lines.length;i++){ if(t >= lines[i].t * k) n = i; else break; }

  if(n !== live){
    live = n;
    const ps = $('flow').querySelectorAll('p');
    ps.forEach(p => p.classList.remove('live'));
    if(n >= 0 && ps[n]){
      ps[n].classList.add('live');
      $('flow').style.transform = 'translateY(' + flowOffset(n) + 'px)';
    } else {
      $('flow').style.transform = 'translateY(' + flowOffset(0) + 'px)';
    }

    if($('lyricSheet').classList.contains('open')){
      const all = $('full').querySelectorAll('p');
      let target = null;
      all.forEach(p=>{
        p.classList.remove('live');
        if(!p.classList.contains('sect') && t >= parseFloat(p.dataset.t) * k) target = p;
      });
      if(target){ target.classList.add('live'); target.scrollIntoView({block:'center', behavior:'smooth'}); }
    }
  }
}

/* ─────────── playback ─────────── */
function select(i, autoplay = true){
  idx = i;
  audio.src = SONGS[idx].src;
  live = -1;
  paint();
  if(autoplay){ wantPlaying = true; audio.play().catch(()=>{}); }
}
function step(d){
  if(shuffle && SONGS.length > 1){
    let n; do { n = Math.floor(Math.random()*SONGS.length); } while(n === idx);
    return n;
  }
  return (idx + d + SONGS.length) % SONGS.length;
}

$('play').addEventListener('click', ()=>{
  if(audio.paused){ wantPlaying = true; audio.play().catch(()=>{}); }
  else { wantPlaying = false; audio.pause(); }
});
$('next').addEventListener('click', ()=> select(step(1)));
$('prev').addEventListener('click', ()=>{
  if(audio.currentTime > 3){ audio.currentTime = 0; live = -1; return; }
  select(step(-1));
});
$('shuffle').addEventListener('click', e=>{
  shuffle = !shuffle;
  e.currentTarget.classList.toggle('on', shuffle);
  e.currentTarget.setAttribute('aria-pressed', shuffle);
});
$('repeat').addEventListener('click', e=>{
  repeat = repeat === 'off' ? 'all' : repeat === 'all' ? 'one' : 'off';
  e.currentTarget.classList.toggle('on', repeat !== 'off');
  e.currentTarget.classList.toggle('one-on', repeat === 'one');
});
$('lyricToggle').addEventListener('click', e=>{
  lyricsOn = !lyricsOn;
  $('flow').classList.toggle('off', !lyricsOn);
  e.currentTarget.classList.toggle('off', !lyricsOn);
  e.currentTarget.title = lyricsOn ? 'Hide lyrics' : 'Show lyrics';
});

audio.addEventListener('play', ()=>{
  $('playicon').innerHTML = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
  $('play').setAttribute('aria-label','Pause');
  buildGrid();
});
audio.addEventListener('pause', ()=>{
  $('playicon').innerHTML = '<path d="M8 5v14l11-7z"/>';
  $('play').setAttribute('aria-label','Play');
  buildGrid();
});
audio.addEventListener('ended', ()=>{
  if(repeat === 'one'){ audio.currentTime = 0; live = -1; wantPlaying = true; audio.play().catch(()=>{}); return; }
  select(step(1));               // wraps past the last song, so playback never stops
});

/* if a file fails to load or play, don't sit there silently — move on */
let skips = 0;
function skipBroken(){
  if(skips >= SONGS.length) return;   // everything is failing; stop trying
  skips++;
  setTimeout(()=>select(step(1)), 600);
}
audio.addEventListener('error', skipBroken);
audio.addEventListener('stalled', ()=>{
  if(audio.readyState < 2 && !audio.paused) audio.load(), audio.play().catch(()=>{});
});
audio.addEventListener('playing', ()=>{ skips = 0; });
audio.addEventListener('loadedmetadata', ()=>{ $('dur').textContent = fmt(SONGS[idx].duration); });
audio.addEventListener('timeupdate', ()=>{
  if(!scrubbing && audio.duration){
    const pct = audio.currentTime / audio.duration * 1000;
    $('seek').value = pct;
    $('seek').style.setProperty('--pct', (pct/10)+'%');
    $('cur').textContent = fmt(audio.currentTime / (scale() || 1));
  }
  runLyrics();
  position();
});

const seek = $('seek');
['mousedown','touchstart'].forEach(e => seek.addEventListener(e, ()=>{ scrubbing = true; }, {passive:true}));
seek.addEventListener('input', ()=>{
  seek.style.setProperty('--pct', (seek.value/10)+'%');
  if(audio.duration) $('cur').textContent = fmt(seek.value/1000 * audio.duration / (scale() || 1));
});
seek.addEventListener('change', ()=>{
  if(audio.duration) audio.currentTime = seek.value/1000 * audio.duration;
  scrubbing = false; live = -1;
});

/* ─────────── lock screen / headphones / car ─────────── */
function mediaSession(){
  if(!('mediaSession' in navigator)) return;
  const s = SONGS[idx];
  navigator.mediaSession.metadata = new MediaMetadata({
    title: s.title, artist: ARTIST, album: ALBUM,
    artwork: [96,192,256,384,512,1024].map(n=>({src: abs(s.art), sizes:n+'x'+n, type:'image/jpeg'}))
  });
  const set = (a, fn) => { try { navigator.mediaSession.setActionHandler(a, fn); } catch(e){} };
  set('play', ()=>{ wantPlaying = true; audio.play().catch(()=>{}); });
  set('pause', ()=>{ wantPlaying = false; audio.pause(); });
  set('previoustrack', ()=>{ if(audio.currentTime>3){ audio.currentTime=0; live=-1; } else select(step(-1)); });
  set('nexttrack', ()=>select(step(1)));
  set('seekbackward', d=>{ audio.currentTime = Math.max(0, audio.currentTime-((d&&d.seekOffset)||10)); live=-1; });
  set('seekforward', d=>{ audio.currentTime = Math.min(audio.duration, audio.currentTime+((d&&d.seekOffset)||10)); live=-1; });
  set('seekto', d=>{ audio.currentTime = d.seekTime; live=-1; });
  set('stop', ()=>{ wantPlaying = false; audio.pause(); audio.currentTime = 0; });
}
function position(){
  if(!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
  if(!audio.duration || !isFinite(audio.duration)) return;
  try{
    navigator.mediaSession.setPositionState({
      duration: audio.duration, playbackRate: audio.playbackRate,
      position: Math.min(audio.currentTime, audio.duration)
    });
  }catch(e){}
}
audio.addEventListener('play', ()=>{ if('mediaSession' in navigator) navigator.mediaSession.playbackState='playing'; });
audio.addEventListener('pause', ()=>{ if('mediaSession' in navigator) navigator.mediaSession.playbackState='paused'; });

/* ─────────── lyrics sheet ─────────── */
function openSheet(){ $('lyricSheet').classList.add('open'); $('scrim').classList.add('on'); live = -1; runLyrics(); }
function closeSheet(){
  document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open'));
  $('scrim').classList.remove('on');
}
$('expand').addEventListener('click', openSheet);
$('art').addEventListener('click', openSheet);
$('scrim').addEventListener('click', closeSheet);
document.querySelectorAll('.sheet .close').forEach(b=>b.addEventListener('click', closeSheet));
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape') closeSheet();
  if(e.code === 'Space' && e.target === document.body){ e.preventDefault(); audio.paused ? audio.play() : audio.pause(); }
  if(e.key === 'ArrowRight') $('next').click();
  if(e.key === 'ArrowLeft') $('prev').click();
});
(function(){
  const sh = $('lyricSheet'); let y0 = null;
  sh.addEventListener('touchstart', e=>{ if(sh.querySelector('.sheet-body').scrollTop <= 0) y0 = e.touches[0].clientY; }, {passive:true});
  sh.addEventListener('touchmove', e=>{ if(y0===null) return;
    const dy = e.touches[0].clientY - y0; if(dy>0) sh.style.transform = 'translateY(' + dy + 'px)'; }, {passive:true});
  sh.addEventListener('touchend', e=>{ if(y0===null) return;
    const dy = e.changedTouches[0].clientY - y0; sh.style.transform=''; if(dy>90) closeSheet(); y0=null; });
})();

/* ─────────── scripture sheet ─────────── */
function openVerse(i){
  const s = SONGS[i === undefined ? idx : i];
  if(!s || !s.verse) return;
  $('vRef').textContent = s.verse.ref;
  $('vVersion').textContent = s.verse.version === 'BSB'
    ? 'Berean Standard Bible' : (s.verse.version || '');
  $('vText').textContent = s.verse.text || '';
  $('vChapter').href = s.verse.chapterUrl || '#';
  $('vChapter').style.display = s.verse.chapterUrl ? '' : 'none';
  closeSheet();
  $('verseSheet').classList.add('open');
  $('scrim').classList.add('on');
}
$('verse').addEventListener('click', ()=>openVerse(idx));

$('fav').addEventListener('click', ()=>{
  $('fav').classList.add('pop');
  setTimeout(()=>$('fav').classList.remove('pop'), 180);
  toggleFav(idx);
});
$('viewToggle').addEventListener('click', e=>{
  e.stopPropagation();
  listView = !listView;
  try { localStorage.setItem(VIEW_KEY, listView ? 'list' : 'grid'); } catch(err){}
  paintFav();
  buildGrid();
});
$('favFilter').addEventListener('click', e=>{
  e.stopPropagation();
  favOnly = !favOnly;
  paintFav();
  buildGrid();
  setLib(true);
});

/* ─────────── the song shelf: slides up to fill the screen ─────────── */
const lib = $('library');
let libOpen = false, restTop = 0;

function measureLib(){
  const deck = document.querySelector('.deck');
  restTop = deck.offsetTop + deck.offsetHeight + 8;
  applyLib();
}
function applyLib(){
  lib.style.top = libOpen ? Math.round(window.innerHeight * 0.25) + 'px' : restTop + 'px';
  lib.classList.toggle('expanded', libOpen);
}
function setLib(open){
  if(libOpen === open) return;
  libOpen = open;
  applyLib();
  if(!open) $('grid').scrollTop = 0;
}
window.addEventListener('resize', ()=>{
  measureLib();
  parkFlow(live >= 0 ? live : 0);
});
$('libhead').addEventListener('click', e=>{
  if(e.target.closest('.libtools')) return;
  setLib(!libOpen);
});
/* scrolling the shelf lifts it; scrolling back to the top drops it */
$('grid').addEventListener('scroll', ()=>{
  if(!libOpen && $('grid').scrollTop > 6) setLib(true);
}, {passive:true});

/* drag the handle up or down */
(function(){
  let y0 = null, moved = false;
  const head = $('libhead');
  head.addEventListener('touchstart', e=>{ y0 = e.touches[0].clientY; moved = false; }, {passive:true});
  head.addEventListener('touchmove', e=>{
    if(y0 === null) return;
    const dy = e.touches[0].clientY - y0;
    if(Math.abs(dy) > 8) moved = true;
  }, {passive:true});
  head.addEventListener('touchend', e=>{
    if(y0 === null) return;
    const dy = e.changedTouches[0].clientY - y0;
    if(moved){ if(dy < -25) setLib(true); else if(dy > 25) setLib(false); }
    y0 = null;
  });
})();

/* ─────────── recover from calls, alarms and other interruptions ───────────
   iOS pauses the audio element for an incoming call and does not always resume.
   Whenever the page is in front of the listener again, quietly try to carry on
   from where the call cut in — but only if they hadn't paused it themselves. */
function tryResume(){
  if(!wantPlaying || !audio.paused) return;
  if(document.visibilityState !== 'visible') return;
  audio.play().catch(()=>{});
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) setTimeout(tryResume, 350); });
window.addEventListener('focus',   ()=> setTimeout(tryResume, 350));
window.addEventListener('pageshow', ()=> setTimeout(tryResume, 350));
audio.addEventListener('canplay',  ()=> setTimeout(tryResume, 100));
/* a slow backstop for the times no event fires at all */
setInterval(tryResume, 4000);

/* ─────────── song requests ─────────── */
function openAsk(){
  closeSheet();
  $('askForm').style.display = '';
  $('askDone').style.display = 'none';
  $('askMsg').className = 'askmsg';
  $('askSend').disabled = false;
  $('askSend').textContent = 'Send request';
  $('askSheet').classList.add('open');
  $('scrim').classList.add('on');
  setTimeout(()=>$('askName').focus(), 320);
}
$('askBtn').addEventListener('click', e=>{ e.stopPropagation(); openAsk(); });

$('askSend').addEventListener('click', async ()=>{
  const name = $('askName').value.trim();
  const theme = $('askTheme').value.trim();
  const msg = $('askMsg');
  if(!name || !theme){
    msg.textContent = 'Please add your name and what the song is about.';
    msg.className = 'askmsg bad';
    (!name ? $('askName') : $('askTheme')).focus();
    return;
  }
  msg.className = 'askmsg';
  $('askSend').disabled = true;
  $('askSend').textContent = 'Sending…';
  try{
    const r = await fetch('/.netlify/functions/song-request', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ name, theme, website: $('askTrap').value })
    });
    const d = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error || 'Could not send.');
    $('askForm').style.display = 'none';
    $('askDone').style.display = 'block';
    $('askName').value = ''; $('askTheme').value = '';
  }catch(err){
    msg.textContent = err.message || 'That did not send. Please try again shortly.';
    msg.className = 'askmsg bad';
    $('askSend').disabled = false;
    $('askSend').textContent = 'Send request';
  }
});

/* ─────────── boot ─────────── */
fetch('songs.json', {cache:'no-cache'})
  .then(r => r.json())
  .then(d => {
    SONGS = d.songs || [];
    ARTIST = d.artist || ARTIST;
    ALBUM = d.album || ALBUM;
    if(!SONGS.length) throw new Error('no songs');
    idx = Math.floor(Math.random() * SONGS.length);
    audio.src = SONGS[idx].src;
    $('dur').textContent = fmt(SONGS[idx].duration);
    paint();
    requestAnimationFrame(measureLib);
  })
  .catch(()=>{
    $('title').textContent = 'Songs unavailable';
    $('sub').textContent = 'Reload to try again.';
  });
</script>
</body>
</html>
