<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jeremy Dixon — Songs</title>
<meta name="description" content="Songs by Jeremy Dixon.">
<meta name="theme-color" content="#0A0A0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Songs">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0B;
    --panel:#141417;
    --text:#FFFFFF;
    --muted:#A0A0AC;
    --dim:#6B6B78;
    --accent:#2BD97C;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;
  }
  button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  #app{height:100%;display:flex;flex-direction:column;max-width:620px;margin:0 auto;
       padding-bottom:max(6px,env(safe-area-inset-bottom))}

  /* ══════════ TOP: artwork with the lyrics running over it ══════════ */
  .stage{position:relative;flex:0 0 auto;height:min(38vh,340px);overflow:hidden;background:#111}
  .stage img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.02)}
  .stage::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(6,6,8,.86) 0%,rgba(6,6,8,.5) 42%,rgba(6,6,8,.15) 66%,var(--bg) 100%)}

  .flowwrap{position:absolute;top:0;left:0;right:0;height:64%;overflow:hidden;z-index:2;
            pointer-events:none;
            -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 72%,transparent 100%);
            mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 72%,transparent 100%)}
  .flow{position:absolute;left:22px;right:22px;top:0;transition:transform .5s cubic-bezier(.25,.8,.3,1)}
  .flow p{margin:0;padding:5px 0;font-size:16px;font-weight:600;line-height:1.32;
          color:rgba(255,255,255,.32);transition:color .35s,transform .35s;
          text-shadow:0 2px 14px rgba(0,0,0,.75)}
  .flow p.live{color:#fff;transform:scale(1.02);transform-origin:left center}
  .flow.off{display:none}

  .stagebtns{position:absolute;right:12px;bottom:10px;z-index:3;display:flex;gap:4px}
  .stagebtns button{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;
                    background:rgba(10,10,12,.55);backdrop-filter:blur(6px);color:#fff;opacity:.85}
  .stagebtns button:hover{opacity:1}
  .stagebtns button.off{color:var(--dim)}
  .stagebtns svg{width:17px;height:17px;fill:currentColor}

  /* ══════════ MIDDLE: track meta + controls ══════════ */
  .deck{flex:0 0 auto;padding:14px 22px 12px}
  .deck h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.015em;line-height:1.2;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .deck .artist{margin:3px 0 0;font-size:13px;color:var(--muted);font-weight:500}

  .seekrow{margin-top:14px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;
                    background:transparent;display:block;margin:0;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;
    background:linear-gradient(to right,var(--accent) var(--pct,0%),rgba(255,255,255,.18) var(--pct,0%))}
  input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:rgba(255,255,255,.18)}
  input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--accent)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
    background:#fff;margin-top:-4px}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}
  .times{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);
         font-variant-numeric:tabular-nums;margin-top:-1px}

  .transport{display:flex;align-items:center;justify-content:space-between;padding:8px 6px 0}
  .transport button{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;
                    color:var(--text);opacity:.75;transition:opacity .15s,transform .15s}
  .transport button:hover{opacity:1}
  .transport button:active{transform:scale(.88)}
  .transport button.on{color:var(--accent);opacity:1}
  .transport svg{width:20px;height:20px;fill:currentColor}
  #play{width:56px;height:56px;background:var(--accent);color:#06210F;opacity:1}
  #play svg{width:24px;height:24px}
  .rpt{position:relative}
  .rpt .one{position:absolute;top:3px;right:4px;font-size:8px;font-weight:700;color:var(--accent);display:none}
  .rpt.one-on .one{display:block}

  /* ══════════ BOTTOM: tiles ══════════ */
  .library{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
           background:var(--panel);border-radius:16px 16px 0 0;margin-top:10px;
           border-top:1px solid rgba(255,255,255,.06)}
  .libhead{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
           padding:14px 20px 10px}
  .libhead h3{margin:0;font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
  .libhead button{font-size:12px;font-weight:600;color:var(--muted);padding:4px 2px}
  .libhead button:hover{color:var(--text)}
  .grid{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
        display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px;padding:2px 20px 22px}
  @media (max-width:400px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (min-width:560px){.grid{grid-template-columns:repeat(4,1fr)}}
  .tile{text-align:left;width:100%}
  .tile .thumb{position:relative;width:100%;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#222}
  .tile .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s,filter .3s}
  .tile:hover .thumb img{transform:scale(1.05)}
  .tile .tt{margin-top:7px;font-size:12.5px;font-weight:600;line-height:1.3;
            display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tile .ts{font-size:11px;color:var(--dim);margin-top:2px;font-variant-numeric:tabular-nums}
  .tile.playing .tt{color:var(--accent)}
  .tile.playing .thumb{outline:2px solid var(--accent);outline-offset:-2px}
  .tile.playing .thumb img{filter:brightness(.5)}
  .bars{position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:3px}
  .tile.playing .bars{display:flex}
  .bars i{width:3px;height:16px;background:var(--accent);border-radius:2px;
          animation:eq .85s ease-in-out infinite}
  .bars i:nth-child(1){animation-delay:-.5s}
  .bars i:nth-child(2){animation-delay:-.25s;height:22px}
  .bars i:nth-child(3){animation-delay:-.1s}
  @keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
  .tile.playing.paused .bars i{animation-play-state:paused;transform:scaleY(.45)}

  /* ══════════ full lyrics sheet ══════════ */
  #scrim{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.65);
         opacity:0;pointer-events:none;transition:opacity .28s}
  #scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;height:88vh;max-width:620px;margin:0 auto;
         background:#111114;border-radius:18px 18px 0 0;border-top:1px solid rgba(255,255,255,.08);
         transform:translateY(101%);transition:transform .34s cubic-bezier(.3,.8,.3,1);
         display:flex;flex-direction:column;padding-bottom:max(8px,env(safe-area-inset-bottom))}
  .sheet.open{transform:translateY(0)}
  .grip{width:36px;height:4px;border-radius:4px;background:rgba(255,255,255,.22);margin:10px auto 2px;flex:0 0 auto}
  .sheet-head{display:flex;align-items:flex-start;justify-content:space-between;padding:8px 22px 10px;flex:0 0 auto}
  .sheet-head h3{margin:0;font-size:16px;font-weight:700}
  .sheet-head .sub{font-size:11px;color:var(--dim);margin-top:2px;font-weight:500}
  .sheet-head button{font-size:12px;font-weight:600;color:var(--muted);padding:6px}
  .sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 22px 45vh}
  .full p{margin:0;padding:7px 0;font-size:19px;font-weight:600;line-height:1.4;
          color:rgba(255,255,255,.34);transition:color .3s}
  .full p.live{color:#fff}
  .full p.sect{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
               color:var(--accent);opacity:.7;padding:20px 0 4px}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.06s !important}}
  @media (max-height:660px){
    .stage{height:32vh}
    #play{width:50px;height:50px}
    .deck{padding-top:10px}
  }
</style>
</head>
<body>
<div id="app">

  <div class="stage" id="stage">
    <img id="art" src="" alt="">
    <div class="flowwrap"><div class="flow" id="flow"></div></div>
    <div class="stagebtns">
      <button id="lyricToggle" title="Hide lyrics" aria-label="Hide lyrics">
        <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 4h10v2H4zm0 4h13v2H4zm0 4h8v2H4z"/></svg>
      </button>
      <button id="expand" title="Full lyrics" aria-label="Full lyrics">
        <svg viewBox="0 0 24 24"><path d="M4 14h2v4h4v2H4v-6zm16-4h-2V6h-4V4h6v6z"/></svg>
      </button>
    </div>
  </div>

  <div class="deck">
    <h2 id="title">—</h2>
    <p class="artist" id="sub">Jeremy Dixon</p>
    <div class="seekrow">
      <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>
    <div class="transport">
      <button id="shuffle" title="Shuffle" aria-label="Shuffle">
        <svg viewBox="0 0 24 24"><path d="M18 4l4 3-4 3V8h-2.2c-1 0-1.6.4-2.3 1.4l-.9 1.3-1.2-1.7.7-1C13.2 6.4 14.3 6 15.8 6H18V4zm0 10l4 3-4 3v-2h-2.2c-1.6 0-2.7-.5-3.7-1.9l-4-5.7C7.4 9.4 6.9 9 5.9 9H2V7h3.9c1.6 0 2.7.5 3.7 1.9l4 5.7c.6.9 1.2 1.4 2.2 1.4H18v-2zM2 15h3.9c1 0 1.5-.4 2.2-1.4l.7-1 1.2 1.7-.9 1.3C8.2 17.1 7.1 17.5 5.6 17.5H2v-2.5z"/></svg>
      </button>
      <button id="prev" title="Previous" aria-label="Previous track">
        <svg viewBox="0 0 24 24"><path d="M7 6h2v12H7zm12 0v12l-9-6z"/></svg>
      </button>
      <button id="play" title="Play" aria-label="Play">
        <svg id="playicon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="next" title="Next" aria-label="Next track">
        <svg viewBox="0 0 24 24"><path d="M15 6h2v12h-2zM5 6l9 6-9 6z"/></svg>
      </button>
      <button id="repeat" class="rpt" title="Repeat" aria-label="Repeat">
        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        <span class="one">1</span>
      </button>
    </div>
  </div>

  <div class="library">
    <div class="libhead">
      <h3 id="libcount">All songs</h3>
      <button id="shuffleAll">Shuffle all</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div id="scrim"></div>
<div class="sheet" id="lyricSheet" role="dialog" aria-label="Lyrics">
  <div class="grip"></div>
  <div class="sheet-head">
    <div><h3 id="sheetTitle">Lyrics</h3><div class="sub" id="sheetSub"></div></div>
    <button class="close">Close</button>
  </div>
  <div class="sheet-body"><div class="full" id="full"></div></div>
</div>

<audio id="audio" preload="metadata" playsinline></audio>

<script>
const $ = id => document.getElementById(id);
const audio = $('audio');
let SONGS = [], ARTIST = 'Jeremy Dixon', ALBUM = 'Songs';
let idx = 0, shuffle = false, repeat = 'off', scrubbing = false, lyricsOn = true, live = -1;

const fmt = s => (!isFinite(s) || s < 0) ? '0:00'
  : Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
const abs = p => new URL(p, location.href).href;

/* Lyric times are stored against each song's true length. If the audio file that
   loads is a different length, scale so the words still land in the right place. */
function scale(){
  const s = SONGS[idx];
  if(!s || !s.duration || !audio.duration || !isFinite(audio.duration)) return 1;
  return audio.duration / s.duration;
}
const sung = s => (s.lines || []).filter(l => !l.sect);

/* ─────────── render ─────────── */
function paint(){
  const s = SONGS[idx];
  $('art').src = s.art;
  $('art').alt = s.title + ' cover';
  $('title').textContent = s.title;
  $('sub').textContent = ARTIST;
  document.title = s.title + ' — ' + ARTIST;
  buildFlow();
  buildFull();
  buildGrid();
  mediaSession();
}

function buildFlow(){
  const wrap = $('flow'), s = SONGS[idx];
  wrap.innerHTML = '';
  wrap.style.transform = 'translateY(0)';
  const lines = sung(s);
  if(!lines.length){
    wrap.innerHTML = '<p>Instrumental</p>';
    return;
  }
  lines.forEach((l,i)=>{
    const p = document.createElement('p');
    p.textContent = l.text;
    p.dataset.i = i;
    wrap.appendChild(p);
  });
  live = -1;
}

function buildFull(){
  const s = SONGS[idx], box = $('full');
  $('sheetTitle').textContent = s.title;
  $('sheetSub').textContent = ARTIST + (s.timing === 'estimated' ? ' · timings estimated' : '');
  box.innerHTML = '';
  (s.lines || []).forEach(l=>{
    const p = document.createElement('p');
    p.textContent = l.text;
    p.dataset.t = l.t;
    if(l.sect) p.className = 'sect';
    box.appendChild(p);
  });
}

function buildGrid(){
  const g = $('grid');
  g.innerHTML = '';
  $('libcount').textContent = SONGS.length + ' songs';
  SONGS.forEach((s,i)=>{
    const b = document.createElement('button');
    b.className = 'tile' + (i === idx ? ' playing' : '') + (i === idx && audio.paused ? ' paused' : '');
    b.innerHTML = '<span class="thumb"><img src="' + s.art + '" alt="" loading="lazy">' +
      '<span class="bars"><i></i><i></i><i></i></span></span>' +
      '<span class="tt">' + s.title + '</span>' +
      '<span class="ts">' + fmt(s.duration) + '</span>';
    b.addEventListener('click', ()=>select(i));
    g.appendChild(b);
  });
}

/* ─────────── lyric scrolling ─────────── */
function runLyrics(){
  const s = SONGS[idx], lines = sung(s);
  if(!lines.length) return;
  const k = scale(), t = audio.currentTime;
  let n = -1;
  for(let i=0;i<lines.length;i++){ if(t >= lines[i].t * k) n = i; else break; }

  if(n !== live){
    live = n;
    const ps = $('flow').querySelectorAll('p');
    ps.forEach(p => p.classList.remove('live'));
    if(n >= 0 && ps[n]){
      ps[n].classList.add('live');
      const wrapH = $('flow').parentElement.clientHeight;
      const y = ps[n].offsetTop + ps[n].offsetHeight/2;
      $('flow').style.transform = 'translateY(' + (wrapH*0.42 - y) + 'px)';
    } else {
      $('flow').style.transform = 'translateY(0)';
    }

    if($('lyricSheet').classList.contains('open')){
      const all = $('full').querySelectorAll('p');
      let target = null;
      all.forEach(p=>{
        p.classList.remove('live');
        if(!p.classList.contains('sect') && t >= parseFloat(p.dataset.t) * k) target = p;
      });
      if(target){ target.classList.add('live'); target.scrollIntoView({block:'center', behavior:'smooth'}); }
    }
  }
}

/* ─────────── playback ─────────── */
function select(i, autoplay = true){
  idx = i;
  audio.src = SONGS[idx].src;
  live = -1;
  paint();
  if(autoplay) audio.play().catch(()=>{});
}
function step(d){
  if(shuffle && SONGS.length > 1){
    let n; do { n = Math.floor(Math.random()*SONGS.length); } while(n === idx);
    return n;
  }
  return (idx + d + SONGS.length) % SONGS.length;
}

$('play').addEventListener('click', ()=> audio.paused ? audio.play() : audio.pause());
$('next').addEventListener('click', ()=> select(step(1)));
$('prev').addEventListener('click', ()=>{
  if(audio.currentTime > 3){ audio.currentTime = 0; live = -1; return; }
  select(step(-1));
});
$('shuffle').addEventListener('click', e=>{
  shuffle = !shuffle;
  e.currentTarget.classList.toggle('on', shuffle);
  e.currentTarget.setAttribute('aria-pressed', shuffle);
});
$('shuffleAll').addEventListener('click', ()=>{
  shuffle = true;
  $('shuffle').classList.add('on');
  select(Math.floor(Math.random()*SONGS.length));
});
$('repeat').addEventListener('click', e=>{
  repeat = repeat === 'off' ? 'all' : repeat === 'all' ? 'one' : 'off';
  e.currentTarget.classList.toggle('on', repeat !== 'off');
  e.currentTarget.classList.toggle('one-on', repeat === 'one');
});
$('lyricToggle').addEventListener('click', e=>{
  lyricsOn = !lyricsOn;
  $('flow').classList.toggle('off', !lyricsOn);
  e.currentTarget.classList.toggle('off', !lyricsOn);
  e.currentTarget.title = lyricsOn ? 'Hide lyrics' : 'Show lyrics';
});

audio.addEventListener('play', ()=>{
  $('playicon').innerHTML = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
  $('play').setAttribute('aria-label','Pause');
  buildGrid();
});
audio.addEventListener('pause', ()=>{
  $('playicon').innerHTML = '<path d="M8 5v14l11-7z"/>';
  $('play').setAttribute('aria-label','Play');
  buildGrid();
});
audio.addEventListener('ended', ()=>{
  if(repeat === 'one'){ audio.currentTime = 0; live = -1; audio.play(); return; }
  if(!shuffle && repeat === 'off' && idx === SONGS.length - 1){ select(0, false); return; }
  select(step(1));
});
audio.addEventListener('loadedmetadata', ()=>{ $('dur').textContent = fmt(SONGS[idx].duration); });
audio.addEventListener('timeupdate', ()=>{
  if(!scrubbing && audio.duration){
    const pct = audio.currentTime / audio.duration * 1000;
    $('seek').value = pct;
    $('seek').style.setProperty('--pct', (pct/10)+'%');
    $('cur').textContent = fmt(audio.currentTime / (scale() || 1));
  }
  runLyrics();
  position();
});

const seek = $('seek');
['mousedown','touchstart'].forEach(e => seek.addEventListener(e, ()=>{ scrubbing = true; }, {passive:true}));
seek.addEventListener('input', ()=>{
  seek.style.setProperty('--pct', (seek.value/10)+'%');
  if(audio.duration) $('cur').textContent = fmt(seek.value/1000 * audio.duration / (scale() || 1));
});
seek.addEventListener('change', ()=>{
  if(audio.duration) audio.currentTime = seek.value/1000 * audio.duration;
  scrubbing = false; live = -1;
});

/* ─────────── lock screen / headphones / car ─────────── */
function mediaSession(){
  if(!('mediaSession' in navigator)) return;
  const s = SONGS[idx];
  navigator.mediaSession.metadata = new MediaMetadata({
    title: s.title, artist: ARTIST, album: ALBUM,
    artwork: [96,192,256,384,512,1024].map(n=>({src: abs(s.art), sizes:n+'x'+n, type:'image/jpeg'}))
  });
  const set = (a, fn) => { try { navigator.mediaSession.setActionHandler(a, fn); } catch(e){} };
  set('play', ()=>audio.play());
  set('pause', ()=>audio.pause());
  set('previoustrack', ()=>{ if(audio.currentTime>3){ audio.currentTime=0; live=-1; } else select(step(-1)); });
  set('nexttrack', ()=>select(step(1)));
  set('seekbackward', d=>{ audio.currentTime = Math.max(0, audio.currentTime-((d&&d.seekOffset)||10)); live=-1; });
  set('seekforward', d=>{ audio.currentTime = Math.min(audio.duration, audio.currentTime+((d&&d.seekOffset)||10)); live=-1; });
  set('seekto', d=>{ audio.currentTime = d.seekTime; live=-1; });
  set('stop', ()=>{ audio.pause(); audio.currentTime = 0; });
}
function position(){
  if(!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
  if(!audio.duration || !isFinite(audio.duration)) return;
  try{
    navigator.mediaSession.setPositionState({
      duration: audio.duration, playbackRate: audio.playbackRate,
      position: Math.min(audio.currentTime, audio.duration)
    });
  }catch(e){}
}
audio.addEventListener('play', ()=>{ if('mediaSession' in navigator) navigator.mediaSession.playbackState='playing'; });
audio.addEventListener('pause', ()=>{ if('mediaSession' in navigator) navigator.mediaSession.playbackState='paused'; });

/* ─────────── lyrics sheet ─────────── */
function openSheet(){ $('lyricSheet').classList.add('open'); $('scrim').classList.add('on'); live = -1; runLyrics(); }
function closeSheet(){ $('lyricSheet').classList.remove('open'); $('scrim').classList.remove('on'); }
$('expand').addEventListener('click', openSheet);
$('art').addEventListener('click', openSheet);
$('scrim').addEventListener('click', closeSheet);
document.querySelector('.sheet .close').addEventListener('click', closeSheet);
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape') closeSheet();
  if(e.code === 'Space' && e.target === document.body){ e.preventDefault(); audio.paused ? audio.play() : audio.pause(); }
  if(e.key === 'ArrowRight') $('next').click();
  if(e.key === 'ArrowLeft') $('prev').click();
});
(function(){
  const sh = $('lyricSheet'); let y0 = null;
  sh.addEventListener('touchstart', e=>{ if(sh.querySelector('.sheet-body').scrollTop <= 0) y0 = e.touches[0].clientY; }, {passive:true});
  sh.addEventListener('touchmove', e=>{ if(y0===null) return;
    const dy = e.touches[0].clientY - y0; if(dy>0) sh.style.transform = 'translateY(' + dy + 'px)'; }, {passive:true});
  sh.addEventListener('touchend', e=>{ if(y0===null) return;
    const dy = e.changedTouches[0].clientY - y0; sh.style.transform=''; if(dy>90) closeSheet(); y0=null; });
})();

/* ─────────── boot ─────────── */
fetch('songs.json', {cache:'no-cache'})
  .then(r => r.json())
  .then(d => {
    SONGS = d.songs || [];
    ARTIST = d.artist || ARTIST;
    ALBUM = d.album || ALBUM;
    if(!SONGS.length) throw new Error('no songs');
    audio.src = SONGS[0].src;
    $('dur').textContent = fmt(SONGS[0].duration);
    paint();
  })
  .catch(()=>{
    $('title').textContent = 'Songs unavailable';
    $('sub').textContent = 'Reload to try again.';
  });
</script>
</body>
</html>
